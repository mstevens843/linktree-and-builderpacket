              - text: "Job Description: Our client is seeking - a highly skilled and motivated Product Engineer to join our team in San Francisco or New York. As a Product Engineer, you will be responsible for designing, developing, and testing our products to ensure they meet the highest quality standards. You will work closely with our cross-functional teams to bring new products to market and improve existing ones. Responsibilities:"
              - list [ref=f227e97]:
                - listitem [ref=f227e98]: Design and develop new products and features based on customer needs and market trends
