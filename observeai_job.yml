    - generic [ref=f372e51]:
      - generic [ref=f372e52]:
        - heading [level=2] [ref=f372e53]:
          - strong [ref=f372e55]: About Patronus AI
        - paragraph [ref=f372e56]
        - paragraph [ref=f372e57]: Patronus AI is a frontier lab developing simulation research and infrastructure to accelerate progress toward human-aligned AGI. We are on a mission to simulate all of the world’s intelligence.
        - paragraph [ref=f372e58]:
          - generic [ref=f372e59]:
            - text: We are the team behind some of the earliest and most influential research in AI evaluation like
            - link "FinanceBench" [ref=f372e60] [cursor=pointer]:
              - /url: https://arxiv.org/pdf/2311.11944
            - text: ","
            - link "Lynx" [ref=f372e61] [cursor=pointer]:
              - /url: https://www.forbes.com/sites/rashishrivastava/2024/07/11/this-ai-powered-coach-catches-hallucinations-in-other-ai-models/
            - text: ","
            - link "SimpleSafetyTests" [ref=f372e62] [cursor=pointer]:
              - /url: https://arxiv.org/abs/2311.08370
            - text: ","
            - link "CopyrightCatcher" [ref=f372e63] [cursor=pointer]:
              - /url: https://www.cnbc.com/2024/03/06/gpt-4-researchers-tested-leading-ai-models-for-copyright-infringement.html
            - text: ","
            - link "Humanity’s Last Exam" [ref=f372e64] [cursor=pointer]:
              - /url: https://arxiv.org/abs/2501.14249
            - text: ", and more. We are formerly AI researchers and engineers from companies like Meta AI, Amazon AGI, and Google. Our customers include foundation model labs and Fortune 500 enterprises like Adobe. We are backed by top-tier investors like Lightspeed Venture Partners, Notable Capital, Stanford University, Noam Brown, Gokul Rajaram, and more."
      - heading [level=2] [ref=f372e65]:
        - strong [ref=f372e66]: Responsibilities
      - paragraph [ref=f372e67]
      - paragraph [ref=f372e68]: As a Product Engineer at Patronus AI, you will build high-quality simulations used to train, evaluate, and improve AI agents. These environments model real-world applications and workflows, producing the interaction data frontier labs need to improve their models.
      - paragraph [ref=f372e69]
      - paragraph [ref=f372e70]: You will own complex agent environments end-to-end, working with Applied Researchers to turn specifications into robust software, subject-matter experts to deepen realism, and platform engineers to improve the tooling we build on.
      - paragraph [ref=f372e71]
      - paragraph [ref=f372e72]: Your work will help frontier labs stress-test and improve the next generation of AI agents, advancing progress toward safe, human-aligned general intelligence.
      - paragraph [ref=f372e73]
      - paragraph [ref=f372e74]:
        - strong [ref=f372e75]: "In this role, you will:"
      - list [ref=f372e76]:
        - listitem [ref=f372e77]: Build RL environments end-to-end — frontend interfaces, backend services, APIs, data models, and workflows — using technologies like React/TypeScript, Next.js, Python, and SQLite.
        - listitem [ref=f372e78]: Work closely with Applied Researchers, subject-matter experts, and QA specialists to ensure our simulations are realistic and recognize when something feels wrong in a simulation. Catch seed data that is suspiciously tidy, a workflow with no contradictions, or a UI with none of the accumulated scar tissue of real software.
        - listitem [ref=f372e79]: Maintain a high bar for the internal tooling you work with, identifying where it falls short and helping improve our systems over time.
        - listitem [ref=f372e80]: Think critically about task coverage, environment correctness, edge cases, and adversarial agent behavior.
        - listitem [ref=f372e81]: Be a power user of AI coding tools (Claude Code, Codex, and similar), with ideas for extending them and building new tooling on top.
      - heading [level=2] [ref=f372e82]:
        - strong [ref=f372e83]: Qualifications
      - paragraph [ref=f372e84]:
        - emphasis [ref=f372e85]: "\"The number one qualification to succeed in this machine learning course is gumption” - John Lafferty, CS Professor at Yale"
      - paragraph [ref=f372e86]
      - paragraph [ref=f372e87]: "Above all, we look for a proactive mindset, willingness to learn, unlimited energy, and relentless optimism. You are a great fit if you have a background in the following:"
      - list [ref=f372e88]:
        - listitem [ref=f372e89]: BS, MS, or PhD in Computer Science, Machine Learning, Statistics, Mathematics, or a related field with 3+ years of experience as a software engineer, full-stack engineer, product engineer, or in a similar role.
        - listitem [ref=f372e90]: A track record of owning complex products end-to-end, from ambiguous requirements through production launch, ideally at a startup or on a small, high-velocity team.
        - listitem [ref=f372e91]: Experience with real enterprise SaaS tools, whether building them or using them deeply in your day-to-day work. CRMs, ticketing systems, billing platforms, or similarly complex applications. You understand how this software behaves after years of users, data, exceptions, and operational constraints.
        - listitem [ref=f372e92]: Strong engineering judgment around correctness, failure modes, edge cases, and adversarial behavior.
      - paragraph [ref=f372e93]
      - paragraph [ref=f372e94]:
        - strong [ref=f372e95]: Nice to have
        - text: ":"
      - list [ref=f372e96]:
        - listitem [ref=f372e97]: Experience with reinforcement learning, agent evaluation, verifiers, reward models, or ML infrastructure — though deep applied research experience isn't required.
        - listitem [ref=f372e98]: Experience with Playwright, Selenium, or browser automation.
      - paragraph [ref=f372e99]
      - strong [ref=f372e101]: To support close collaboration, this role is based in our San Francisco headquarters and requires in-office attendance 5 days a week.
      - generic [ref=f372e103]:
        - emphasis [ref=f372e104]: The expected base salary range for this role is
        - emphasis [ref=f372e105]: $125,000 - $200,000 USD
        - emphasis [ref=f372e106]: . In addition to base salary, we offer equity and benefits. Actual compensation will be determined based on experience, qualifications, skills, and location.
      - generic [ref=f372e107]:
        - heading [level=2] [ref=f372e108]:
