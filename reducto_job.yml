            - generic [ref=f187e113]:
              - strong [ref=f187e114]: About Reducto
              - text: Reducto is the agentic document platform for leading AI teams who demand enterprise performance at scale. We provide a comprehensive toolkit for working with documents the way a human would, combining custom in-house and leading frontier models to power efficient and accurate document workflows. We’ve grown rapidly, increasing revenue 8x year over year and partnering with hundreds of companies, from leading AI teams like Harvey, Vanta, and Scale, to enterprise customers across FAANG and top trading firms. Reducto has raised over $100M from world-class investors including a16z, Benchmark, and First Round Capital. The Role As a Product Engineer, you'll work on the features used by our customers to design, build, test, and evaluate their business critical document workflows. Our goal is to make document data accessible to anyone, technical or not. We aim to build a end-to-end product suite that starts from where your documents are stored all the way to exporting the parsed and extracted data to where you want to use it. You'll work on everything from interactive document viewers to data extraction workflows, building delightful experiences that make complex AI capabilities feel simple.
              - strong [ref=f187e115]: "We Would Love To Meet You If You:"
              - list [ref=f187e116]:
                - listitem [ref=f187e117]: "Philosophy: You are your own worst critic. You have a high bar for quality and don't rest until the job is done right—no settling for 90%. We want someone who ships fast, with high agency, and who doesn't just voice problems but actively jumps in to fix them."
                - listitem [ref=f187e118]: "Product Intuition: You have a sharp eye for what good product looks like and how it's built. You care about the details that matter and think with first principles."
                - listitem [ref=f187e119]: "Experience: You have 2+ years of experience building applications with modern frameworks."
                - listitem [ref=f187e120]: "Language/Skills: You're exceptional at TypeScript and React, with strong design sensibility. You understand both the technical and visual aspects of great product experiences."
                - listitem [ref=f187e121]: "Tools: Build your own tools as needed—like a quick prototype to test a new interaction pattern or a component library to speed up development."
                - listitem [ref=f187e122]: "Approach: A quantitative approach to building products. Ability to debug, experiment, and iterate fast. You should be comfortable getting hands-on with the full development lifecycle, from ideation to shipping to users."
              - strong [ref=f187e123]: "The Core Work Will Include:"
              - list [ref=f187e124]:
                - listitem [ref=f187e125]: Building and refining Reducto Studio's core features—document viewers, extraction workflows, data visualization, and editing interfaces
                - listitem [ref=f187e126]: Creating delightful, intuitive UIs that elegantly decomposes complex document workflows
                - listitem [ref=f187e127]: Ideating, prototyping and iteratively delivering new features like form filling, translations, document editing and document classification
                - listitem [ref=f187e128]: Implementing real-time collaboration features and responsive interfaces that work seamlessly across devices
                - listitem [ref=f187e129]: Working within our design system and stack (Next.js, Tailwind, Convex) to ship fast while maintaining high quality
                - listitem [ref=f187e130]: Experimenting with new interaction patterns to make AI-powered document processing feel magical
                - listitem [ref=f187e131]: Working directly with the founders and customers to shape the product direction based on user feedback
              - strong [ref=f187e132]: "Bonus Points If You:"
              - list [ref=f187e133]:
                - listitem [ref=f187e134]: Have prior experience founding a company or building products at early stages
                - listitem [ref=f187e135]: Have experience with document viewers, PDF rendering, or complex data visualization
                - listitem [ref=f187e136]: Are ambitious and driven, and care a lot about doing great work with great people
                - listitem [ref=f187e137]: Keep up with the latest developments in frontend engineering and design systems
              - text: This is an in person role at our office in SF. We're an early stage company which means that the role requires working hard and moving quickly. Please only apply if that excites you.
              - strong [ref=f187e138]: About Reducto
              - emphasis [ref=f187e139]: Nearly 80% of enterprise data is in unstructured formats like PDFs
              - text: PDFs are the status quo for enterprise knowledge in nearly every industry. Insurance claims, financial statements, invoices, and health records are all stored in a structure that’s simply impractical for use in digital workflows. This isn’t an inconvenience—it’s a critical bottleneck that leads to dozens of wasted hours every week.
              - emphasis [ref=f187e140]: Traditional approaches fail at reliably extracting information in complex PDFs
              - text: "OCR and even more sophisticated ML approaches work for simple text documents but are unreliable for anything more complex. Text from different columns are jumbled together, figures are ignored, and tables are a nightmare to get right. Overcoming this usually requires a large engineering effort dedicated to building specialized pipelines for every document type you work with. Reducto Breaks Document Layouts Into Subsections And Then Contextually Parses Each Depending On The Type Of Content. This Is Made Possible By a Combination Of Vision Models, LLMs, And a Suite Of Heuristics We Built Over Time. Put Simply, We Can Help You:"
              - list [ref=f187e141]:
                - listitem [ref=f187e142]: Accurately extract text and tables even with nonstandard layouts
                - listitem [ref=f187e143]: Automatically convert graphs to tabular data and summarize images in documents
                - listitem [ref=f187e144]: Extract important fields from complex forms with simple, natural language instructions
                - listitem [ref=f187e145]: Build powerful retrieval pipelines using Reducto’s document metadata
                - listitem [ref=f187e146]: Intelligently chunk information using the document’s layout data
              - text: Benefits at Reducto
              - emphasis [ref=f187e147]: "At Reducto, we’re invested in the well-being and growth of our team. Here’s what we currently offer:"
              - list [ref=f187e148]:
                - listitem [ref=f187e149]: "Unlimited PTO: We believe great work requires recharging."
                - listitem [ref=f187e150]: "Lunch: Receive a free lunch to eat with your teammates daily at the office"
                - listitem [ref=f187e151]: "Reimbursed Transportation: Provide us with your receipts and we’ll take care of the costs"
                - listitem [ref=f187e152]: "Insurance: Generous health insurance covering medical, dental, and vision."
                - listitem [ref=f187e153]: "Health and Wellness Budget: We provide up to $150/mo reimbursement for health and wellness spending, such as gym memberships, fitness classes, or similar."
                - listitem [ref=f187e154]: "Parental Leave: Work with us to build a leave schedule that works for you and your family"
              - text: Reducto is an Equal Opportunity Employer committed to diversity and inclusion in the workplace. All qualified applicants will receive consideration for employment without regard to sex, race, color, age, national origin, religion, physical and mental disability, genetic information, marital status, sexual orientation, gender identity/assignment, citizenship, pregnancy or maternity, protected veteran status, or any other status prohibited by applicable national, federal, state or local law.
