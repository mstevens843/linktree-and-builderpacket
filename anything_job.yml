        - generic [ref=f207e117]:
          - generic [ref=f207e119]:
            - generic [ref=f207e120]:
              - strong [ref=f207e121]: Anything
              - text: Anything is the AI product engineer for the next wave of entrepreneurs. It's an AI agent that turns English into apps. Everything you need make money on the internet built in - mobile, web, design, AI, backend, infra, payments. Launched Aug 7th. https://x.com/anything Hit $5m rev and growing quickly Try it at anything.com
              - strong [ref=f207e122]: Role
              - strong [ref=f207e123]:
                - strong [ref=f207e124]: Who this role is for
              - text: This role is for an experienced product engineer who wants real ownership, real leverage, and real impact. You have already shipped meaningful products and systems. You are comfortable taking responsibility for outcomes, not just execution. You care deeply about product quality, system design, and user experience, and you want your decisions to shape the direction of what gets built. You thrive in environments with ambiguity. You are energized by loosely defined problems and take initiative to clarify goals, explore constraints, and drive toward strong solutions. You are trusted to make technical and product tradeoffs independently and to mentor others by example. You enjoy working across the stack and across disciplines. You move fluidly between backend systems, frontend interfaces, and product decisions. You want to help define how a product is built, not just implement tickets. This is not a role for someone who wants narrow scope or heavy process. It is for someone who wants to operate as a force multiplier.
              - strong [ref=f207e125]: What You Will Do
              - text: "You will own complex, high impact product work end to end, from early problem framing through production and iteration. You will:"
              - list [ref=f207e126]:
                - listitem [ref=f207e127]: Lead the design and implementation of user facing features across frontend and backend using TypeScript, React, Tailwind, and Postgres
                - listitem [ref=f207e128]: Translate ambiguous product goals into clear technical plans and shipped outcomes
                - listitem [ref=f207e129]: Partner closely with product and design to shape roadmap decisions and execution strategy
                - listitem [ref=f207e130]: Talk directly with users to understand workflows, pain points, and opportunities
                - listitem [ref=f207e131]: Drive fast iteration loops using feedback, data, and firsthand product usage
                - listitem [ref=f207e132]: Raise the quality bar through thoughtful system design, testing, and code review
                - listitem [ref=f207e133]: Identify and resolve structural issues that slow the team or degrade product quality
                - listitem [ref=f207e134]: Mentor junior engineers through pairing, feedback, and setting strong technical examples
                - listitem [ref=f207e135]: Contribute to a culture of ownership, clarity, and high standards
              - text: You will be expected to move fast while thinking holistically, choosing solutions that scale with the product and team rather than optimizing for short term convenience.
              - strong [ref=f207e136]: How You Will Be Successful
              - text: "Your success will be measured by:"
              - list [ref=f207e137]:
                - listitem [ref=f207e138]: End to end ownership You take responsibility for important product areas, drive decisions, and reliably deliver high quality features without heavy oversight.
                - listitem [ref=f207e139]: Technical and product leadership You make sound architectural and product tradeoffs, improve system quality over time, and elevate the thinking of those around you.
                - listitem [ref=f207e140]: Shipped product impact Your work measurably improves user experience, product depth, reliability, and development velocity.
              - strong [ref=f207e141]:
                - strong [ref=f207e142]: Required background
              - text: "Strong candidates typically have:"
              - list [ref=f207e143]:
                - listitem [ref=f207e144]: Several years of experience building and shipping production software
                - listitem [ref=f207e145]: A strong technical foundation from a CS program or equivalent real world experience
                - listitem [ref=f207e146]: Experience owning significant product or system areas end to end
                - listitem [ref=f207e147]: Deep comfort with TypeScript and modern frontend development
                - listitem [ref=f207e148]: Solid backend fundamentals including data modeling, APIs, and system design
                - listitem [ref=f207e149]: Strong debugging skills and the ability to reason through complex systems
                - listitem [ref=f207e150]: Clear written and verbal communication
                - listitem [ref=f207e151]: A demonstrated ability to learn new domains quickly and apply them in practice
                - listitem [ref=f207e152]: Experience operating in fast paced environments with high ownership
              - strong [ref=f207e153]:
                - strong [ref=f207e154]: Nice to have
              - list [ref=f207e155]:
                - listitem [ref=f207e156]: Experience at an early stage or high growth startup
                - listitem [ref=f207e157]: Experience collaborating deeply with design and product partners
                - listitem [ref=f207e158]: A track record of mentoring or leading other engineers
                - listitem [ref=f207e159]: Personal projects or writing that demonstrate taste and initiative
                - listitem [ref=f207e160]: Interests beyond engineering such as design, writing, economics, or philosophy
              - strong [ref=f207e161]:
                - strong [ref=f207e162]: Why this role matters
              - text: We are building ambitious products at the intersection of AI and modern software. Doing that well requires senior product engineers who can think clearly, learn continuously, and ship with conviction. In this role, you will have outsized influence on the product, the codebase, and the team. You will work on problems that matter, help shape how we build, and play a key role in defining the future of the company.
              - strong [ref=f207e163]: In all roles
              - text: "We look for:"
              - strong [ref=f207e164]: Intense
              - text: . Ship fast. Cycles are hours, not weeks. Hard to outwork.
              - strong [ref=f207e165]: Ownership
              - text: ". Grab the #1 priority and relentless to deliver."
              - strong [ref=f207e166]: Fearlessness
              - text: . Risk on. Do the unknown / uncomfortable. Say "good" to bad news.
              - strong [ref=f207e167]: Taste
              - text: . Obsess over quality. Know what “great” looks like. No slop.
              - strong [ref=f207e168]: Play
              - text: . Curiosity, joy, and energy. Sound like you? Come do the most meaningful work of your career.
              - strong [ref=f207e169]: Applying
              - text: "Submit here and we'll reach out if it's a fit. Compensation Range: $125K - $200K"
