                - strong [ref=f157e1021]: Description
                - text: Amazon Lab126 is an inventive research and development company that designs and engineers high-profile consumer electronics. Lab126 began in 2004 as a subsidiary of Amazon.com, Inc., originally creating the best-selling Kindle family of products. Since then, we have produced groundbreaking devices like Fire tablets, Fire TV and Amazon Echo. What will you help us create? Key job responsibilities As a Sr. Product Design Engineer on our team, you will be responsible for the mechanical design, development, and quality of consumer electronic products. We are looking for candidates who thrive in a fast paced start-up like environment and want to invent the future. In the role, you will wear many hats in working on the system design down to quick turn prototypes, manufacturing production process, testing, and quality control. You will play a role in defining processes and methods to improve the productivity of the entire team. You will identify and initiate investigations of production technologies, prototype and test solutions for product features, and design and validate production designs that deliver an exceptional user experience. You will work in a small PD team to create a new experience and work with the team at large to ensure a functional and beautiful product. To be successful you need to be highly motivated, understand how to solve problems and dive deep while delivering to the highest standards.
                - strong [ref=f157e1022]: Skills
                - text: "You will demonstrate a strong working knowledge of mechanical systems, with expertise in systems integration; the desire to learn from new challenges and the problem solving and communication skills to work within a highly interactive and experienced team. Candidates must show a hands-on passion for their work and be able to communicate their ideas and concepts both verbally and visually. Candidates must demonstrate an ability to integrate feedback and to respond quickly to changing contexts and work environments. In this role, you will:"
                - list [ref=f157e1023]:
                  - listitem [ref=f157e1024]: Research into materials and component technologies to scope development opportunities
                  - listitem [ref=f157e1025]: Feature design and testing to meet program objective
                  - listitem [ref=f157e1026]: Test failure analysis and solution validation to complete successful product development
                  - listitem [ref=f157e1027]: Provide detailed part design and product documentation
                  - listitem [ref=f157e1028]: Field failure analysis and solution evaluation for production product issues
                  - listitem [ref=f157e1029]: Support positive team interactions to accomplish program objectives
                  - listitem [ref=f157e1030]: Provide cross-functional program integration support to ensure team success
                  - listitem [ref=f157e1031]: Lead project teams to timely delivery of products
                  - listitem [ref=f157e1032]: Manage schedules and milestones
                  - listitem [ref=f157e1033]: Manage interaction with overseas resources
                  - listitem [ref=f157e1034]: Apply technical expertise to problem solving throughout product lifecycle
                - strong [ref=f157e1035]: Basic Qualifications
                - list [ref=f157e1036]:
                  - listitem [ref=f157e1037]: Experience in developing functional specifications, design verification plans and functional test procedures
                - strong [ref=f157e1038]: Preferred Qualifications
                - list [ref=f157e1039]:
                  - listitem [ref=f157e1040]: Master's degree in electrical engineering, computer engineering, or equivalent
                  - listitem [ref=f157e1041]: Experience working with interdisciplinary teams to execute product design from concept to production
                  - listitem [ref=f157e1042]: Experience with the project management of technical projects
                - text: "Amazon is an equal opportunity employer and does not discriminate on the basis of protected veteran status, disability, or other legally protected status. Los Angeles County applicants: Job duties for this position include: work safely and cooperatively with other employees, supervisors, and staff; adhere to standards of excellence despite stressful conditions; communicate effectively and respectfully with employees, supervisors, and staff to ensure exceptional customer service; and follow all federal, state, and local laws and Company policies. Criminal history may have a direct, adverse, and negative relationship with some of the material job duties of this position. These include the duties and responsibilities listed above, as well as the abilities to adhere to company policies, exercise sound judgment, effectively manage stress and work safely and respectfully with others, exhibit trustworthiness and professionalism, and safeguard business operations and the Company’s reputation. Pursuant to the Los Angeles County Fair Chance Ordinance, we will consider for employment qualified applicants with arrest and conviction records. Our inclusive culture empowers Amazonians to deliver the best results for our customers. If you have a disability and need a workplace accommodation or adjustment during the application and hiring process, including support for the interview or onboarding process, please visit https://amazon.jobs/content/en/how-we-hire/accommodations for more information. If the country/region you’re applying in isn’t listed, please contact your Recruiting Partner. The base salary range for this position is listed below. Your Amazon package will include sign-on payments and restricted stock units (RSUs). Final compensation will be determined based on factors including experience, qualifications, and location. Amazon also offers comprehensive benefits including health insurance (medical, dental, vision, prescription, Basic Life & AD&D insurance and option for Supplemental life plans, EAP, Mental Health Support, Medical Advice Line, Flexible Spending Accounts, Adoption and Surrogacy Reimbursement coverage), 401(k) matching, paid time off, and parental leave. Learn more about our benefits at https://amazon.jobs/en/benefits. USA, CA, Sunnyvale - 157,900.00 - 213,600.00 USD annually"
