        - generic [ref=f71e87]:
          - generic [ref=f71e89]:
            - generic [ref=f71e90]:
              - text: "Pylon — the agentic support platform purpose-built for B2B. Pylon is the only agentic support platform, purpose-built for B2B companies. For leaders scaling AI-native support teams, Pylon lets humans and agents collaborate on customer work – investigating, resolving, and acting on every signal across every channel that matters. Unlike platforms built before the AI era, Pylon enriches every interaction with deep account-level context, automates the low impact customer work, and surfaces answers before your team even has to ask. The result: faster responses, happier customers, and a system that continuously improves itself. We're backed by a16z, BCV, General Catalyst, and Y Combinator. More than 1,500 companies including Linear, Cognition (makers of Devin), Modal Labs, and Incident.io run their support and customer success workflows on Pylon. We're also featured on the Enterprise Tech 30 List. What You'll Do"
              - list [ref=f71e91]:
                - listitem [ref=f71e92]: Build features so our customers in post-Sales roles (Customer Support & Customer Success) run their operations more efficiently by leveraging AI
                - listitem [ref=f71e93]: Build prototypes, work independently, iterate quickly, and ship fast
                - listitem [ref=f71e94]: Have high autonomy, own things end to end, and project manage your own work
                - listitem [ref=f71e95]: Work with PMs, designers, and other engineers in a highly collaborative, non-waterfall way
                - listitem [ref=f71e96]: Collaborate with a strong technical team of senior engineers from places like Samsara, Affinity, Airbnb, and Meta
              - text: What We’re Looking For
              - list [ref=f71e97]:
                - listitem [ref=f71e98]: You are pursuing a bachelor’s or master’s degree in computer science, engineering, or another related field and can start full-time in Summer 2027.
                - listitem [ref=f71e99]: You have relevant internship experience or side projects building product features and a demonstration of strong full-stack fundamentals
                - listitem [ref=f71e100]: You have a growth mindset, want to constantly improve, and want to receive feedback.
                - listitem [ref=f71e101]: You're in SF or you're willing to relocate, you love working in-person, and you're serious about joining us to build a culture we'll all love
                - listitem [ref=f71e102]: (Bonus) You have interned at high-growth startups and can navigate ambiguous environments.
                - listitem [ref=f71e103]: (Bonus) You highly leverage AI for software development and can juggle multiple workstreams at the same time.
                - listitem [ref=f71e104]: (Bonus) You have experience with our tech stack (React, Golang, GraphQL, and AWS).
              - strong [ref=f71e105]: Our Perks
              - text: 🚆 Commuter benefits 🌱 Parental leave 🏝️ 14 company holidays + unlimited PTO 🗺️ Annual offsite 🍽 Lunch, dinner, and snacks at the office 🏋️ Fitness stipend
              - strong [ref=f71e106]: More About Pylon
              - strong [ref=f71e107]: "Funding:"
              - text: Series B led by a16z and BCV ($51M total raised)
              - strong [ref=f71e108]: "Founders:"
              - text: Advith Chelikani, Robert Eng, and Marty Kausas
              - strong [ref=f71e109]: "Team:"
              - text: Currently 100+ and growing!
              - strong [ref=f71e110]: Additional Job Details
              - text: "The base salary range for this position is $150k - $180k annually. Compensation may vary outside of this range depending on a number of factors, including a candidate’s qualifications, skills, competencies and experience. Base pay is one part of the Total Package that is provided to compensate and recognize employees for their work at Pylon. This role is eligible for stock options, as well as a comprehensive benefits package. Compensation Range: $150K - $180K"
