            - generic [ref=f267e94]:
              - paragraph [ref=f267e95]:
                - strong [ref=f267e96]: "Location:"
                - text: Fully Remote (USA) · Timezone-aligned
                - strong [ref=f267e97]: "Compensation:"
                - text: 80k–100k + Equity + Quarterly Performance Bonuses
              - paragraph [ref=f267e98]
              - paragraph [ref=f267e99]:
                - strong [ref=f267e100]: "The Mission: Transforming Businesses for the AI Age"
              - paragraph [ref=f267e101]: Many businesses still depend on disconnected software, spreadsheets, manual processes, and knowledge trapped inside individual employees’ heads. Lumion brings those systems and processes together so organizations can operate more intelligently and efficiently.
              - paragraph [ref=f267e102]
              - paragraph [ref=f267e103]: We are starting with trade and technical schools. Our platform powers the entire institution, from the first lead through enrollment, tuition payments, compliance reporting, graduation, and career tracking.
              - paragraph [ref=f267e104]
              - paragraph [ref=f267e105]: These schools prepare electricians, welders, nurses, technicians, and other skilled professionals who keep the country moving. By modernizing their operations, Lumion helps them serve more students and strengthen the skilled workforce.
              - paragraph [ref=f267e106]
              - paragraph [ref=f267e107]:
                - strong [ref=f267e108]: "The Opportunity: Learn How Software Will Be Built in the Future"
              - paragraph [ref=f267e109]: This is a place to launch your career at the cutting edge of software development. You will learn how coding will be done in the future and become part of the wave changing how software is created.
              - paragraph [ref=f267e110]
              - paragraph [ref=f267e111]: Our stack and development processes are AI First. Claude Code and Codex are part of our normal workflow, with access to the latest frontier models without having to ration tokens or worry about usage limits. You will learn the workflows, judgment, and verification practices required to use these systems effectively and become a 100x developer.
              - paragraph [ref=f267e112]
              - paragraph [ref=f267e113]: Working at a startup also gives you the opportunity to wear different hats and see problems from engineering, product, customer, and business perspectives. You will gain experience that is difficult to find when working inside one narrow area of a larger company.
              - paragraph [ref=f267e114]
              - paragraph [ref=f267e115]: If you want a fast moving environment, the excitement of solving new problems, and the chance to look back proudly on helping build something significant, this is that opportunity.
              - paragraph [ref=f267e116]
              - paragraph [ref=f267e117]:
                - strong [ref=f267e118]: "The Role: Code at the Speed of Thought"
              - paragraph [ref=f267e119]: Your work will span backend business logic, data models, APIs, integrations, administrative workflows, customer facing interfaces, and automated tests.
              - paragraph [ref=f267e120]
              - paragraph [ref=f267e121]: You will be a full member of the engineering team from day one and trusted with meaningful production work. Important assignments are not reserved for people with longer résumés. You will be held to the same standards for quality, communication, and follow through as every other engineer at Lumion.
              - paragraph [ref=f267e122]
              - paragraph [ref=f267e123]:
                - strong [ref=f267e124]: What We’re Looking For
              - paragraph [ref=f267e125]: Professional software engineering experience is not required.
              - list [ref=f267e126]:
                - listitem [ref=f267e127]:
                  - strong [ref=f267e128]: A Bachelor’s degree in Computer Science is required.
                  - text: The degree must be completed before your employment begins. Current students may apply if they will graduate before their start date.
                - listitem [ref=f267e129]:
                  - strong [ref=f267e130]: Evidence that you have put your programming skills into practice.
                  - text: This can come from a capstone, internship, personal project, open source contribution, research project, freelance engagement, or another hands on project. We want to understand what you worked on, what you personally contributed, and what you learned.
                - listitem [ref=f267e131]:
                  - strong [ref=f267e132]: Confidence in at least one programming language.
                  - text: You can build with it, debug it, and explain the logic behind your decisions. The language does not need to be PHP, and prior Laravel experience is not required.
                - listitem [ref=f267e133]:
                  - strong [ref=f267e134]: An understanding of web development fundamentals.
                  - text: You are familiar with concepts such as HTTP, APIs, authentication, databases, browser interfaces, version control, and automated testing.
                - listitem [ref=f267e135]:
                  - strong [ref=f267e136]: Logical problem solving.
                  - text: You can break an unfamiliar problem into manageable parts, investigate failures systematically, and work toward the underlying cause.
                - listitem [ref=f267e137]:
                  - strong [ref=f267e138]: Product judgment.
                  - text: You consider the person using the software and connect technical decisions to the problem being solved.
              - paragraph [ref=f267e139]
              - paragraph [ref=f267e140]:
                - strong [ref=f267e141]: How We Work
              - paragraph [ref=f267e142]: Lumion is a high trust team. We share context openly, keep our egos low, raise risks early, and ask questions when something does not make sense.
              - paragraph [ref=f267e143]: To show that you read the entire posting, tell us in your application what you would do with a golden banana. There are no wrong answers except not answering.
              - paragraph [ref=f267e144]
              - paragraph [ref=f267e145]:
                - strong [ref=f267e146]: The Stack
              - paragraph [ref=f267e147]: "Our current application stack includes:"
              - list [ref=f267e148]:
                - listitem [ref=f267e149]:
                  - strong [ref=f267e150]: "Application:"
                  - text: PHP 8.4+, Laravel 12+, Livewire, Filament, Blade, JavaScript, and Tailwind CSS
                - listitem [ref=f267e151]:
                  - strong [ref=f267e152]: "Data:"
                  - text: MySQL, Redis, pgvector, and Pinecone
                - listitem [ref=f267e153]:
                  - strong [ref=f267e154]: "Testing:"
                  - text: Pest PHP
              - paragraph [ref=f267e155]
              - paragraph [ref=f267e156]:
                - strong [ref=f267e157]: Why Join Lumion Now?
              - paragraph [ref=f267e158]: Lumion closed a $10.7 million seed round backed by TTV Capital and Tusk Venture Partners. More than 400 career schools use our platform to support over 150,000 students across 48 states and 29 industries.
              - paragraph [ref=f267e159]
              - paragraph [ref=f267e160]: Schools using Lumion see 47% more completed applications, a 73.6% application to enrollment rate, 91% on time tuition collection, and 21% higher student retention.
              - paragraph [ref=f267e161]: We have the capital and momentum to build something that lasts while remaining early enough for every engineer to influence the product and company.
              - paragraph [ref=f267e162]
              - paragraph [ref=f267e163]:
                - strong [ref=f267e164]: Remote First
              - paragraph [ref=f267e165]: This is a full time remote position. You must reside in and be authorized to work in the United States. Your normal workday must overlap by at least six hours with our Salt Lake City team.
              - paragraph [ref=f267e166]
