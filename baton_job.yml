        - generic [ref=f141e91]:
          - generic [ref=f141e93]:
            - generic [ref=f141e94]:
              - strong [ref=f141e95]: Who We Are
              - strong [ref=f141e96]: Baton
              - text: is
              - strong [ref=f141e97]: Ryder
              - text: ’s in-house product development group focused on harnessing emerging technologies to redefine transportation and logistics. With $10B in freight under management, our technology reaches every part of the U.S. economy. We design and ship category-defining software that enables Ryder and its 50,000+ customers—including some of the world’s most well-known brands—to plan and execute freight intelligently, efficiently, and cost-effectively. Our work includes everything from customer-facing software to the data platform that will power the next era of innovation at Ryder.
              - strong [ref=f141e98]: Baton’s mission
              - text: ": enable supply chain on autopilot. Ryder acquired Baton in 2022 to power its next wave of digital products. We operate at startup speed, with Fortune 500 reach. If you have a passion for solving complex problems and creating impact for the engine of the American economy, you’ll love it here."
              - strong [ref=f141e99]: "Role:"
              - text: Software Engineer - Full Stack
              - strong [ref=f141e100]: "Location:"
              - text: Hayes Valley, San Francisco, CA
              - strong [ref=f141e101]: Basic Job Details
              - strong [ref=f141e102]: "Job Type:"
              - text: Full Time
              - strong [ref=f141e103]: "Work Model:"
              - text: Hybrid
              - strong [ref=f141e104]: "Remote Days:"
              - text: Monday & Friday
              - strong [ref=f141e105]: "Office Days:"
              - text: Tuesday, Wednesday, Thursday
              - strong [ref=f141e106]: Job Description
              - text: We are looking for a Full-Stack Software Engineer who excels in dynamic environments and is driven to develop applications that connect with users. The ideal candidate will play a crucial role in designing and implementing both the front-end and back-end components of our applications, utilizing a diverse technology stack that includes Typescript, React, Python, GraphQL, etc. Candidates should be proactive, adept problem solvers with solid programming expertise in modern front-end and full-stack languages, and a deep enthusiasm for technology.
              - strong [ref=f141e107]: Responsibilities
              - list [ref=f141e108]:
                - listitem [ref=f141e109]: Plan and execute project milestones, identifying and mitigating risks and swiftly resolving issues as they arise to deliver high-quality work
                - listitem [ref=f141e110]: Develop and enhance the architecture of web applications to ensure scalability, maintainability, and performance. Collaborate with senior engineers and architects to define system structure and core components.
                - listitem [ref=f141e111]: Develop backend application layers and data models, ensuring robust functionality, security, and scalability. Our current tech stack includes Python 3, GraphQL, and FastAPI
                - listitem [ref=f141e112]: Build and maintain frontend interfaces using React and TypeScript, ensuring an exceptional user experience and high performance across all platforms
                - listitem [ref=f141e113]: Collaborate with cross-functional teams to understand end-user requirements, create effective project plans, and deliver effective technical solutions
                - listitem [ref=f141e114]: Continually stay up-to-date with industry trends and technologies to ensure our technology stack remains current and competitive
              - strong [ref=f141e115]: Minimum Qualifications
              - list [ref=f141e116]:
                - listitem [ref=f141e117]: 3+ years of full-stack software development experience with web application architecture and design patterns for complex enterprise applications
                - listitem [ref=f141e118]: Familiarity with web development best practices, and demonstrated ability to discuss engineering and product tradeoffs
                - listitem [ref=f141e119]: Proficiency in Python with a track record of building intuitive, responsive, and fast web interfaces
                - listitem [ref=f141e120]: Proficiency with frontend languages and technologies such as Typescript and React
              - strong [ref=f141e121]: Preferred Qualifications
              - list [ref=f141e122]:
                - listitem [ref=f141e123]: Bachelor’s or Master’s Degree in Computer Science, Engineering, or a related technical field
                - listitem [ref=f141e124]: Strong foundation in first principles thinking to drive problem-solving and innovation
                - listitem [ref=f141e125]: Experience working with AWS or similar cloud-based services
              - strong [ref=f141e126]: The Perks
              - list [ref=f141e127]:
                - listitem [ref=f141e128]: Competitive Base Salary + Cash Bonus Structure
                - listitem [ref=f141e129]: Annual Company Bonus + Long Term Incentive Plan
                - listitem [ref=f141e130]: 401k with Matching
                - listitem [ref=f141e131]: Hybrid Work Schedule
                - listitem [ref=f141e132]: Hyper-Stable, publicly traded Enterprise
                - listitem [ref=f141e133]: Medical, Dental, and Vision Health Coverage
                - listitem [ref=f141e134]: Employee Stock Purchase Program (15% discount to market value)
                - listitem [ref=f141e135]: Collaborative, Fun, and Tech Forward office in Hayes Valley, San Francisco, CA
              - strong [ref=f141e136]: "Compensation Range:"
              - text: The annual base salary range for this position is $150,000 - $200,000*. Compensation will vary based on factors including skill level, transferable knowledge, and experience. Note that the above is not the representation of total compensation, which includes our LTI Package as well. In addition to base salary, Baton's full-time employees are eligible for an annual company performance bonuses.
              - strong [ref=f141e137]: Why You Should Join
              - list [ref=f141e138]:
                - listitem [ref=f141e139]:
                  - strong [ref=f141e140]: "Have an immediate impact:"
                - list [ref=f141e141]:
                  - listitem [ref=f141e142]: With Ryder’s existing customer base of 50,000+ companies and an internal headcount of 43,000, the scale and impact of our products will be large and far-reaching, from day one.
                - listitem [ref=f141e143]:
                  - strong [ref=f141e144]: "Opportunity to grow and lead in a Fortune 500 company:"
                - list [ref=f141e145]:
                  - listitem [ref=f141e146]: You’ll get to work in a rapidly growing, startup-like environment while having the stability and backing of Ryder and its full executive team.
                - listitem [ref=f141e147]:
                  - strong [ref=f141e148]: "Creative, fast-paced environment to solve impactful problems in Supply Chain:"
                - list [ref=f141e149]:
                  - listitem [ref=f141e150]: We’re going to design completely new tools for an industry that hasn’t been rethought in decades. And to do this, we need people who think differently.
