                - strong [ref=f131e975]: Job Description
                - text: As a Senior Software Engineer – Go (Golang), you will design, develop, and deliver high-performance middleware and application software solutions supporting GM’s next-generation in-vehicle infotainment platforms and connected vehicle systems. You will play a critical role in building scalable, reliable, and efficient systems that enable advanced user experiences, vehicle integration, and cloud-connected capabilities. This role requires strong technical expertise, ownership, and the ability to collaborate effectively across cross-functional teams.
                - strong [ref=f131e976]: "What You'll Do:"
                - list [ref=f131e977]:
                  - listitem [ref=f131e978]: Design, develop, and maintain high-performance backend services, middleware, and platform applications for GM infotainment and connected systems
                  - listitem [ref=f131e979]: Write clean, maintainable, and high-performance Go code; ensure scalability, fault tolerance, and resiliency
                  - listitem [ref=f131e980]: Build high-throughput systems optimized for memory efficiency, low latency, and overall performance
                  - listitem [ref=f131e981]: Contribute to system architecture and design, driving technical solutions aligned with platform and product requirements
                  - listitem [ref=f131e982]: Own the end-to-end defect lifecycle, including root cause analysis, resolution, validation, and continuous improvement
                  - listitem [ref=f131e983]: Collaborate with cross-functional teams (Systems, Integration, Product, Platform, Design) to deliver robust and integrated software solutions
                  - listitem [ref=f131e984]: Lead and participate in design reviews, code reviews, and technical discussions to ensure high-quality, maintainable solutions
                  - listitem [ref=f131e985]: Mentor and coach engineers, promoting best practices in coding, testing, and system design
                  - listitem [ref=f131e986]: Utilize Agile development processes, including Sprint Planning, Daily Stand-Ups, and Retrospectives
                  - listitem [ref=f131e987]: Adhere to GM’s software development processes, ensuring quality and alignment with architectural standards.
                - strong [ref=f131e988]: "Your Skills & Abilities (Qualifications):"
                - list [ref=f131e989]:
                  - listitem [ref=f131e990]: Bachelor’s degree in Computer Science, Electrical Engineering, or a related field
                  - listitem [ref=f131e991]: 5+ years of software development experience
                  - listitem [ref=f131e992]: Strong proficiency in Go fundamentals (structs, interfaces, channels, goroutines) and deep understanding of concurrency and parallel processing
                  - listitem [ref=f131e993]: Experience designing and developing RESTful APIs, gRPC services, and backend systems
                  - listitem [ref=f131e994]: Experience designing and building distributed systems or microservices architectures
                  - listitem [ref=f131e995]: Experience with CI/CD pipelines, Git-based workflows, and modern development tools
                  - listitem [ref=f131e996]: Experience with SQL and/or NoSQL databases and data-driven applications
                  - listitem [ref=f131e997]: Strong analytical and problem-solving skills, with the ability to diagnose and resolve complex system issues
                  - listitem [ref=f131e998]: Excellent communication skills and ability to collaborate across distributed teams.
                - listitem [ref=f131e999]
                - strong [ref=f131e1000]: "What Will Give You a Competitive Edge (Preferred Qualifications):"
                - list [ref=f131e1001]:
                  - listitem [ref=f131e1002]: Experience in automotive software development, particularly infotainment systems, clusters, or vehicle middleware
                  - listitem [ref=f131e1003]: Understanding of the Vehicle Development Process (VDP) or similar automotive lifecycle processes
                  - listitem [ref=f131e1004]: Experience with system observability (logging, monitoring, tracing) and production support
                  - listitem [ref=f131e1005]: Exposure to safety-critical or real-time systems.
                - text: "Compensation: The compensation information is a good faith estimate only. It is based on what a successful applicant might be paid in accordance with applicable state laws."
                - strong [ref=f131e1006]: The compensation may not be representative for positions located outside of the California Bay Area
                - text: ". The salary range for this role is $160,000 and $200,000. The actual base salary a successful candidate will be offered within this range will vary based on factors relevant to the position. Bonus Potential: An incentive pay program offers payouts based on company performance, job level, and individual performance. Benefits: GM offers a variety of health and wellbeing benefit programs. Benefit options include medical, dental, vision, Health Savings Account, Flexible Spending Accounts, retirement savings plan, sickness and accident benefits, life insurance, paid vacation & holidays, tuition assistance programs, employee assistance program, GM vehicle discounts and more. This role is categorized as hybrid. This means the selected candidate is expected to report to a specific location at least 3 times a week {or other frequency dictated by their manager}. This job may be eligible for relocation benefits."
                - strong [ref=f131e1007]: About GM
                - text: Our vision is a world with Zero Crashes, Zero Emissions and Zero Congestion and we embrace the responsibility to lead the change that will make our world better, safer and more equitable for all.
                - strong [ref=f131e1008]: Why Join Us
                - text: We believe we all must make a choice every day – individually and collectively – to drive meaningful change through our words, our deeds and our culture. Every day, we want every employee to feel they belong to one General Motors team.
                - strong [ref=f131e1009]: Benefits Overview
                - text: From day one, we're looking out for your well-being–at work and at home–so you can focus on realizing your ambitions. Learn how GM supports a rewarding career that rewards you personally by visiting
                - strong [ref=f131e1010]: Total Rewards resources
                - text: .
                - strong [ref=f131e1011]: Non-Discrimination and Equal Employment Opportunities (U.S.)
                - text: General Motors is committed to being a workplace that is not only free of unlawful discrimination, but one that genuinely fosters inclusion and belonging. We strongly believe that providing an inclusive workplace creates an environment in which our employees can thrive and develop better products for our customers. All employment decisions are made on a non-discriminatory basis without regard to sex, race, color, national origin, citizenship status, religion, age, disability, pregnancy or maternity status, sexual orientation, gender identity, status as a veteran or protected veteran, or any other similarly protected status in accordance with federal, state and local laws. We encourage interested candidates to review the key responsibilities and qualifications for each role and apply for any positions that match their skills and capabilities. Applicants in the recruitment process may be required, where applicable, to successfully complete a role-related assessment(s) and/or a pre-employment screening prior to beginning employment. To learn more, visit
                - strong [ref=f131e1012]: How we Hire
                - text: .
                - strong [ref=f131e1013]: Accommodations
                - text: General Motors offers opportunities to all job seekers including individuals with disabilities. If you need a reasonable accommodation to assist with your job search or application for employment,
                - strong [ref=f131e1014]: email
                - text: us or call us at 1-800-865-7580. In your email, please include a description of the specific accommodation you are requesting as well as the job title and requisition number of the position for which you are applying.
