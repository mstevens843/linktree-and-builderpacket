      - heading "08 IF HE ASKS HOW YOU WOULD HANDLE THAT CLASS OF BUG" [level=2] [ref=e141]
      - generic [ref=e142]:
        - generic [ref=e143]: Your design reasoning, not a claim about their implementation | 45-60 seconds
        - paragraph [ref=e144]: I'd start by identifying which object version the operation is authorized to change. A queued delete should not apply to a newer upload just because the path matches.
        - paragraph [ref=e145]: I'd record the intent durably, compare the expected version, and use a version-specific or conditional storage operation where the provider supports it. A read-then-delete sequence alone can still race. I'd make handlers safe under duplicate events and use reconciliation to resolve incomplete or conflicting observations.
        - paragraph [ref=e146]: The tests would exercise both event orders, duplicate delivery, and a crash after storage changed but before our database recorded the result.
