      - heading "15 AGENT EVAL FOUNDRY" [level=2] [ref=e293]
      - generic [ref=e294]:
        - generic [ref=e295]: How do you build a useful benchmark? | 50-65 seconds
        - paragraph [ref=e296]: I built Agent Eval Foundry to create and audit coding-agent tasks. The recorded work includes 25 task packages and 170 physical attempts, with reviewed outcomes kept separate from the raw history.
        - paragraph [ref=e297]: I start with a clear capability and explicit rules, check that a valid solution can pass, then use invalid implementations and alternative valid solutions to challenge the verifier. When a failure comes from the task or grader, I label it and revisit the result.
        - paragraph [ref=e298]: For a biology task, I would work with a domain expert on the expected conclusion and evidence. My contribution would be the reproducible environment, runner, artifact trail, and checks that the scoring behaves as intended.
      - heading "16 A SPECIFIC GRADER DEFECT" [level=2] [ref=e299]
      - generic [ref=e300]:
        - generic [ref=e301]: Judge-Artifact | 40-50 seconds
        - paragraph [ref=e302]: In Judge-Artifact, I reproduced a mismatch in Inspect Evals helpers. With two successful calls to the same function, using different arguments and responses, one helper returned the second call's arguments while another returned the first call's response.
        - paragraph [ref=e303]: That can create a story about an action that never actually occurred as one call. I built regression cases and checked them against the installed package. It reinforced the need to bind arguments, responses, and outcomes to the same call identity before assigning credit.
