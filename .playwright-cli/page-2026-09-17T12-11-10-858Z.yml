      - 'heading "Design exercise: a reliable benchmark runner" [level=1] [ref=e370]'
      - generic [ref=e371]: Practice scenario, not a prediction of the interview or a description of LatchBio's private architecture.
      - heading "21 START BY CLARIFYING THE WORKLOAD" [level=2] [ref=e372]
      - paragraph [ref=e373]: Ask about run volume and duration, CPU/GPU needs, data size, untrusted code, external APIs, budget, and isolation requirements. Clarify what counts as a scientific failure versus an infrastructure failure.
      - generic [ref=e374]:
        - generic [ref=e375]: How would you build it? | 55-70 seconds
        - paragraph [ref=e376]: I'd give each logical run an immutable specification and durable ID, then let a queue dispatch attempts to isolated workers. PostgreSQL could hold run state and ownership; object storage could hold inputs, logs, and outputs.
        - paragraph [ref=e377]: Each attempt would use pinned code, dependencies, data references, and model/harness settings. The worker would have bounded resources and scoped access. It would upload immutable artifacts before a conditional state transition records completion.
        - paragraph [ref=e378]: A separate grader would evaluate those artifacts. I'd preserve failed and incomplete attempts, enforce concurrency and cost limits, and make recovery safe under duplicate delivery. Before scaling out, I'd test crashes at each handoff and measure where time and money go.
      - generic [ref=e379]:
        - generic [ref=e380]: Run API+ durable spec
        - generic [ref=e381]: →
        - generic [ref=e382]: Queue+ claims
        - generic [ref=e383]: →
        - generic [ref=e384]: Isolatedworker
        - generic [ref=e385]: →
        - generic [ref=e386]: Artifacts+ manifest
        - generic [ref=e387]: →
        - generic [ref=e388]: Grader+ results
      - paragraph [ref=e389]: Separate logical run IDs from attempt IDs. Evidence must remain available after a worker exits.
      - heading "22 FAILURE CASES TO WALK THROUGH" [level=2] [ref=e390]
      - table [ref=e391]:
        - rowgroup [ref=e395]:
          - row [ref=e396]:
            - columnheader "FAILURE" [ref=e397]
            - columnheader "DESIGN RESPONSE" [ref=e398]
        - rowgroup [ref=e399]:
          - row [ref=e400]:
            - cell "Worker dies after uploading output" [ref=e401]
            - cell "Attempt-specific immutable keys and a complete manifest permit reconciliation before re-running." [ref=e402]
          - row [ref=e403]:
            - cell "Two workers claim the same run" [ref=e404]
            - cell "Atomic claim plus a lease/generation. Reject stale completion writes. Expired leases alone do not stop an old worker." [ref=e405]
          - row [ref=e406]:
            - cell "Model provider times out" [ref=e407]
            - cell "Record the provider request and uncertainty; use bounded retries. Preserve cost and attempt history." [ref=e408]
          - row [ref=e409]:
            - cell "Grader or input is broken" [ref=e410]
            - cell "Infrastructure/invalid-task status stays visible and separate from an agent failing a valid task." [ref=e411]
          - row [ref=e412]:
            - cell "A run exceeds time or memory limits" [ref=e413]
            - cell "Stop it, retain logs, classify the cause, and apply an explicit retry policy." [ref=e414]
      - heading "23 SCALING WITHOUT LOSING THE EXPERIMENT" [level=2] [ref=e415]
      - paragraph [ref=e416]: Measure queue delay, worker startup, dataset download, model wait, execution, grading, and upload separately. Add bounded concurrency, per-tenant quotas, and backpressure. Cache immutable inputs by version or digest; keep attempt outputs isolated. A change in resources or time budget may change the benchmark itself.
