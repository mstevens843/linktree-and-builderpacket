            - cell "How would you sandbox agent code?" [ref=e436]
            - cell "Scope data and credentials, restrict network access, avoid host mounts, and bound CPU, memory, disk, process count, and runtime. Use stronger isolation such as a userspace kernel or microVM when the threat model requires it. A container alone is not a complete security boundary." [ref=e437]
          - row [ref=e438]:
            - cell "What needs to be outside the sandbox?" [ref=e439]
            - cell "The authoritative grader, hidden reference data, artifact acceptance rules, and control-plane credentials. Read-only access still leaks an answer key." [ref=e440]
          - row [ref=e441]:
            - cell "Does a database transaction cover an API call?" [ref=e442]
            - cell "No. It can atomically record intent and local state, but it cannot roll back an arbitrary external effect. Use an outbox, stable identity, receiver semantics, and reconciliation." [ref=e443]
          - row [ref=e444]:
            - cell "How do you preserve large-data reproducibility?" [ref=e445]
            - cell "Record exact object versions or digests, environment/image identity, code revision, parameters, and output lineage. Pin what can be pinned and record what cannot." [ref=e446]
          - row [ref=e447]:
            - cell "What makes a cache key safe?" [ref=e448]
            - 'cell "It must include everything that affects the result: input version, code, configuration, and relevant environment. Separate cached artifacts from authorization to use them." [ref=e449]'
          - row [ref=e450]:
            - cell "How do you debug a slow analysis?" [ref=e451]
            - cell "Trace the stages, identify the bottleneck, and measure one change at a time. Check cold starts, repeated downloads, CPU/memory pressure, model waits, queries, and artifact uploads." [ref=e452]
