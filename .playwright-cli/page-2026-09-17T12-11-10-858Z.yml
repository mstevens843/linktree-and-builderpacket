      - paragraph [ref=e139]:
        - text: The article uses a deletion followed by a new upload at the same key to explain a stale-operation race. It describes version-aware state transitions and waiting for storage confirmation. Its broader lesson is to make synchronization idempotent and preserve enough evidence to reconcile state.
