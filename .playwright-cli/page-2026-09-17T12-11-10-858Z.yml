      - heading "13 YOUR MAIN RELIABILITY STORY" [level=2] [ref=e227]
      - generic [ref=e228]:
        - generic [ref=e229]: Explain the problem, experiment, and result | 60-75 seconds
        - paragraph [ref=e230]: I built Crashpoint to examine the gap between what a workflow runtime records and what happened outside it. If an external action completes but the worker fails before recording the result, recovery can repeat the action.
        - paragraph [ref=e231]: The harness measures effects through a separate ledger process. The worker can request an effect, but it cannot read or reset the authoritative count. That gives me evidence independent of the runtime's own success report.
        - paragraph [ref=e232]: A recent experiment used CrewAI's actual tool retry path. I compared a clean run, an error before the effect, and an error after the effect. The last case produced two effects in each of 30 trials. I published the reproduction upstream, with the version, injection point, and limitations.
