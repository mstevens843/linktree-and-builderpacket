      - generic [ref=e15]:
        - heading "Solutions Engineer (Early Career)" [level=2] [ref=e16]
        - generic [ref=e17]:
          - generic [ref=e18]:
            - generic [ref=e19]:
              - generic [ref=e20]:
                - generic [ref=e21]:
                  - paragraph [ref=e22]:
                    - strong [ref=e24]: About Nerdio
                  - paragraph [ref=e25]: At Nerdio, our mission is to simplify the lives of IT professionals and maximize their Microsoft cloud and end user computing investments.
                  - paragraph [ref=e26]
                  - paragraph [ref=e27]: We support organizations of all sizes looking to deploy, manage, and cost-optimize native Microsoft technologies. We partner with Enterprises and Managed Service Providers all over the world to add value on top of their existing native Microsoft investments like Azure Virtual Desktop (AVD), Windows 365, and Microsoft Intune.
                  - paragraph [ref=e28]
                  - paragraph [ref=e29]: Created in 2016, Nerdio has always taken a market-leading and collaborative approach to cloud deployment and management. In fact, our product roadmap is greatly influenced by the regular feedback we receive from having seen companies deploy AVD into production environments several thousand times using Nerdio technology.
                  - paragraph [ref=e30]
                  - paragraph [ref=e31]: Today, Nerdio is used in over 50 countries by more than 15,000 organizations of every size and vertical. We’re committed to delivering exceptional service and support, which starts with identifying and supporting the best staff possible.
                  - paragraph [ref=e32]
                  - paragraph [ref=e33]: We are a fast-moving, nimble company looking for individuals who are collaborative, empathetic, driven and who love to move at the speed of light. If you want to be part of the AVD transformation that Microsoft and Nerdio are leading, then we want to speak with you.
                - generic [ref=e34]:
                  - paragraph [ref=e35]:
                    - strong [ref=e37]: About the role
                  - paragraph [ref=e38]
                  - paragraph [ref=e39]: The Corporate Development team is Nerdio's internal R&D and AI engineering hub. We build the automations, AI agents, AI-powered tools, and full-stack internal applications that make teams across Nerdio faster and more effective. The team also works closely with the data engineering function on the systems and data that power reporting, analytics, and AI-driven applications across the business.
                  - paragraph [ref=e40]
                  - paragraph [ref=e41]: As a Solutions Engineer on this team, you will be a hands-on builder working across an unusually broad range of technologies and business problems. You might spend one day building an AI agent, another adding a feature to an internal web application, another integrating with an API or MCP server, and another prototyping an idea for Sales, Support, Product, or Operations.
                  - paragraph [ref=e42]
                  - paragraph [ref=e43]: This is an early-career engineering role designed for someone who is curious, technically capable, comfortable learning quickly, and excited to use modern AI development tools as part of their everyday workflow. You are not expected to arrive knowing everything in our stack. You are expected to be able to learn quickly, ask good questions, understand what you are building, and steadily take on more ownership as your experience grows.
                  - paragraph [ref=e44]
                  - paragraph [ref=e45]: Our development process is heavily AI-assisted. Tools such as Claude Code, Cursor, Copilot, and other AI development environments are part of how we work every day. We care less about how quickly you can write code from scratch and more about whether you can understand a system, reason through a problem, evaluate AI-generated code, troubleshoot when something goes wrong, and ultimately take responsibility for what you ship.
                  - paragraph [ref=e46]:
                    - strong [ref=e48]: What you'll do
                  - paragraph [ref=e49]
                  - paragraph [ref=e50]:
                    - strong [ref=e52]: Research, Development & Rapid Prototyping
                  - list [ref=e53]:
                    - listitem [ref=e54]: Work with the team to turn real business problems across Nerdio into prototypes, automations, and internal applications.
                    - listitem [ref=e55]: Experiment with new AI models, APIs, frameworks, SDKs, and developer tools.
                    - listitem [ref=e56]: Build proofs of concept quickly, gather feedback, and help determine which ideas are worth continuing.
                    - listitem [ref=e57]: Learn how to move successful prototypes toward secure, maintainable production systems.
                    - listitem [ref=e58]: Contribute ideas for new tools and automations based on problems you observe across the company.
                  - paragraph [ref=e59]:
                    - strong [ref=e61]: AI Engineering & Automation
                  - list [ref=e62]:
                    - listitem [ref=e63]: Build AI-powered workflows, agents, and internal tools with guidance from more experienced engineers.
                    - listitem [ref=e64]: Work with technologies such as tool/function calling, MCP, APIs, structured outputs, retrieval, agent orchestration, and LLM-driven automation.
                    - listitem [ref=e65]: Integrate AI systems with internal business platforms and data sources.
                    - listitem [ref=e66]: Test AI behavior, investigate failure modes, and improve reliability.
                    - listitem [ref=e67]: Learn and apply the team's patterns for building AI systems safely and responsibly.
                  - paragraph [ref=e68]: You do not need to already be an expert in agentic AI. You should be interested in understanding how these systems actually work beyond simply prompting a chatbot.
                  - paragraph [ref=e69]:
                    - strong [ref=e71]: Full-Stack Development & Platform
                  - list [ref=e72]:
                    - listitem [ref=e73]: Build and maintain features across internal web applications.
                    - listitem [ref=e74]: Work with technologies such as TypeScript, JavaScript, Node.js, React or similar frontend frameworks, and PostgreSQL.
                    - listitem [ref=e75]: Build APIs, backend services, integrations, dashboards, and user-facing features.
                    - listitem [ref=e76]: Debug issues across the application stack and learn how different parts of a production system interact.
                    - listitem [ref=e77]: Participate in code reviews and learn how to evaluate both human-written and AI-generated code.
                  - paragraph [ref=e78]: Our stack will continue to evolve. We value the ability to learn technologies quickly more than experience with one exact framework.
                  - paragraph [ref=e79]:
                    - strong [ref=e81]: Azure, DevOps & Platform Engineering
                  - list [ref=e82]:
                    - listitem [ref=e83]: Deploy and operate applications in Microsoft Azure.
                    - listitem [ref=e84]: Gain hands-on experience with services such as App Service, Container Apps, Functions, ACR, Key Vault, Entra ID, and Azure monitoring tools.
                    - listitem [ref=e85]: Work with GitHub Actions and existing CI/CD pipelines.
                    - listitem [ref=e86]: Learn good practices around environments, secrets, configuration, releases, and observability.
                    - listitem [ref=e87]: Help diagnose deployment and production issues as they arise.
                  - paragraph [ref=e88]: You are not expected to arrive as an Azure architect. You should be interested in learning how applications operate after the code leaves your laptop.
                  - paragraph [ref=e89]
                  - paragraph [ref=e90]:
                    - strong [ref=e92]: Data Analytics
                  - list [ref=e93]:
                    - listitem [ref=e94]: Work with data engineers and other team members to integrate applications with Nerdio's internal data platforms.
                    - listitem [ref=e95]: Write queries and work with relational data used by dashboards, reporting, and AI applications.
                    - listitem [ref=e96]: Help identify data quality issues and improve how applications consume and use internal data.
                    - listitem [ref=e97]: Learn foundational data warehousing and data modeling concepts.
                    - listitem [ref=e98]: Participate in projects that connect structured business data with AI-powered workflows.
                  - paragraph [ref=e99]:
                    - strong [ref=e101]: AI Assisted Engineering
                  - paragraph [ref=e102]: AI development tools are a core part of how this team works.
                  - paragraph [ref=e103]: You will learn how to use tools such as Claude Code, Cursor, Copilot, and agent-based development workflows to research, design, build, test, and troubleshoot software. Using AI to write code is expected. Blindly accepting what AI produces is not.
                  - paragraph [ref=e104]: "You should develop the ability to:"
                  - list [ref=e105]:
                    - listitem [ref=e106]: Explain what the code you are shipping does.
                    - listitem [ref=e107]: Understand the architecture of the systems you work on.
                    - listitem [ref=e108]: Identify when AI-generated code is incorrect, insecure, unnecessarily complicated, or solving the wrong problem.
                    - listitem [ref=e109]: Break large problems into smaller tasks that AI systems can execute effectively.
                    - listitem [ref=e110]: Validate results through testing, debugging, documentation, and experimentation.
                    - listitem [ref=e111]: Know when AI is useful and when a simpler approach is better.
                  - paragraph [ref=e112]:
                    - strong [ref=e114]: Collaboration and Internal Enablement
                  - list [ref=e115]:
                    - listitem [ref=e116]: Work directly with teams across Nerdio including Sales, Customer Success, Support, Product, Engineering, Operations, Finance, and Security.
                    - listitem [ref=e117]: Help understand business problems before jumping directly into technical solutions.
                    - listitem [ref=e118]: Demonstrate tools and features you have worked on to internal users.
                    - listitem [ref=e119]: Gather feedback and turn it into product improvements.
                    - listitem [ref=e120]: Share useful discoveries, development techniques, and AI workflows with teammates.
                    - listitem [ref=e121]: Contribute to documentation and internal knowledge sharing.
                  - paragraph [ref=e122]: As you grow in the role, you will have opportunities to lead demonstrations, own projects, teach others, and help shape how Nerdio uses AI and automation.
                  - paragraph [ref=e123]:
                    - strong [ref=e125]: Security Awareness
                  - paragraph [ref=e126]: Learn and follow good practices around identity, authentication, secrets, permissions, data handling, dependencies, and application security.
                  - list [ref=e127]:
                    - listitem [ref=e128]: Consider security when designing and implementing features rather than treating it as something added afterward.
                    - listitem [ref=e129]: Work with Nerdio's security team when deeper expertise or review is required.
                  - paragraph [ref=e130]: Security is everyone's responsibility, but this is not primarily a security engineering role.
                  - paragraph [ref=e131]
                  - paragraph [ref=e132]:
                    - strong [ref=e134]: Required Qualifications
                  - paragraph [ref=e135]: We are intentionally keeping the experience requirements broad. Strong recent graduates and early-career engineers are encouraged to apply.
                  - list [ref=e136]:
                    - listitem [ref=e137]: Bachelor's degree in Computer Science, Information Technology, Engineering, Cybersecurity, Data Science, or a related technical field, or equivalent hands-on technical experience.
                    - listitem [ref=e138]: Demonstrated ability to build software through coursework, internships, personal projects, open-source contributions, employment, or similar experience.
                    - listitem [ref=e139]: Working knowledge of at least one modern programming language. Experience with JavaScript or TypeScript is especially useful.
                    - listitem [ref=e140]: Basic understanding of APIs, databases, web applications, and software development fundamentals.
                    - listitem [ref=e141]: Familiarity with Git and source control concepts.
                    - listitem [ref=e142]: Experience using modern AI tools for technical work, or a strong interest in learning AI-assisted software development.
                    - listitem [ref=e143]: Ability to read code, reason about what it is doing, and troubleshoot problems.
                    - listitem [ref=e144]: Strong curiosity and willingness to learn unfamiliar technologies.
                    - listitem [ref=e145]: Ability to communicate technical ideas clearly and work collaboratively with others.
                    - listitem [ref=e146]: Comfortable taking feedback, asking questions, and iterating quickly.
                  - paragraph [ref=e147]:
                    - strong [ref=e149]: Preferred Qualifications
                  - paragraph [ref=e150]: These are helpful, but we do not expect an early-career candidate to have all of them.
                  - list [ref=e151]:
                    - listitem [ref=e152]: Internship, coursework, or project experience building web applications.
                    - listitem [ref=e153]: Experience with TypeScript, JavaScript, Python, PowerShell, or Bash.
                    - listitem [ref=e154]: Experience with React, Node.js, or similar frameworks.
                    - listitem [ref=e155]: Exposure to Microsoft Azure or another major cloud platform.
                    - listitem [ref=e156]: Experience building something using an LLM API or AI SDK.
                    - listitem [ref=e157]: Familiarity with AI concepts such as RAG, agents, tool calling, MCP, embeddings, or structured outputs.
                    - listitem [ref=e158]: Experience working with relational databases or SQL.
                    - listitem [ref=e159]: Familiarity with Docker, CI/CD, GitHub Actions, or Infrastructure-as-Code.
                    - listitem [ref=e160]: Exposure to Microsoft technologies such as Entra ID, Microsoft Graph, Azure Virtual Desktop, Windows 365, or Intune.
                    - listitem [ref=e161]: Personal projects that demonstrate experimentation, curiosity, or creative use of technology.
                  - paragraph [ref=e162]: A strong GitHub project, internship, hackathon project, or independently built application can be just as interesting to us as professional experience.
                  - paragraph [ref=e163]:
                    - strong [ref=e165]: KEY COMPETENCIES
                  - paragraph [ref=e166]
                  - paragraph [ref=e167]:
                    - strong [ref=e169]: Learning Velocity
                  - paragraph [ref=e170]: You can get dropped into something unfamiliar, research it, experiment with it, and become productive quickly.
                  - paragraph [ref=e171]:
                    - strong [ref=e173]: Builder's Mindset
                  - paragraph [ref=e174]: You like making things work. You would rather build a small prototype and learn from it than spend weeks theorizing about the perfect solution.
                  - paragraph [ref=e175]:
                    - strong [ref=e177]: AI Fluency
                  - paragraph [ref=e178]: You are comfortable collaborating with AI tools and interested in learning how to use them as engineering systems rather than simply chat interfaces.
                  - paragraph [ref=e179]:
                    - strong [ref=e181]: Technical Curiosity
                  - paragraph [ref=e182]: You want to understand why something works, not just copy the solution that made the error disappear.
                  - paragraph [ref=e183]:
                    - strong [ref=e185]: Ownership
                  - paragraph [ref=e186]: When you work on something, you care whether it actually works for the person using it.
                  - paragraph [ref=e187]:
                    - strong [ref=e189]: Pragmatism
                  - paragraph [ref=e190]: You are willing to use the simplest technology that solves the problem instead of reaching for complexity because it is interesting.
                  - paragraph [ref=e191]:
                    - strong [ref=e193]: Communication
                  - paragraph [ref=e194]: You can explain what you built, why you built it, and what you learned to both technical and non-technical colleagues.
                  - paragraph [ref=e195]:
                    - strong [ref=e197]: Adaptability
                  - paragraph [ref=e198]: The technologies this team uses will change quickly. You are comfortable learning continuously rather than defining yourself by one language or framework.
                  - paragraph [ref=e199]:
                    - strong [ref=e201]: WHAT SUCCESS LOOKS LIKE IN THE FIRST 12 MONTHS
                  - paragraph [ref=e202]
                  - paragraph [ref=e203]:
                    - strong [ref=e205]: 3 Months
                  - paragraph [ref=e206]: You understand the team's core applications, development workflow, Azure environment, GitHub practices, and AI development tooling. You are regularly contributing code, fixing issues, building smaller features, and participating effectively in the team's AI-assisted development process.
                  - paragraph [ref=e207]:
                    - strong [ref=e209]: 6 Months
                  - paragraph [ref=e210]: You have shipped meaningful features, automations, or AI-powered capabilities into production and can independently handle well-scoped engineering tasks from development through deployment. You understand enough of the team's architecture to troubleshoot across multiple parts of the stack rather than only working within a single component.
                  - paragraph [ref=e211]:
                    - strong [ref=e213]: 9 Months
                  - paragraph [ref=e214]: You can take a moderately scoped internal problem, work with the people experiencing it, design an appropriate solution, build a prototype, incorporate feedback, and move it toward production with limited guidance. You are beginning to develop deeper expertise in one or more areas such as AI engineering, application development, cloud infrastructure, data, or platform engineering.
                  - paragraph [ref=e215]:
                    - strong [ref=e217]: 12 Months
                  - paragraph [ref=e218]: You are a trusted, independent contributor who can own meaningful projects end-to-end. You have shipped tools that people across Nerdio actively use, understand how those systems operate in production, and can explain the technical decisions behind them. You are increasingly contributing your own ideas, helping newer team members where appropriate, and developing toward broader technical ownership within the team.
                  - paragraph [ref=e219]
                  - paragraph [ref=e220]:
                    - strong [ref=e222]: Working Arrangement
                  - paragraph [ref=e223]: This role is remote-first and works closely with teams across Engineering, Product, Data, Security, Sales.
                  - paragraph [ref=e224]
                  - paragraph [ref=e225]: This role is limited to US Persons or those with valid work authorization that does not require sponsorship.
                  - paragraph [ref=e226]
                  - paragraph [ref=e227]:
                    - strong [ref=e229]: Benefits and Incentives
                  - list [ref=e230]:
                    - listitem [ref=e231]: Competitive Base and Incentive Plan
                    - listitem [ref=e232]: Stock Options
                    - listitem [ref=e233]: Health and Welfare Plans*
                    - listitem [ref=e234]: Life and Disability Plans*
                    - listitem [ref=e235]: Retirement Plan*
                    - listitem [ref=e236]: Unlimited Flexible Paid Time Off, including your birthday off!
                    - listitem [ref=e237]: Collaborative Team Culture
                  - paragraph [ref=e238]: "* Benefits for international employees, outside the US, vary by country."
                  - paragraph [ref=e239]
                  - paragraph [ref=e240]: Nerdio is committed to a diverse and inclusive workplace. Nerdio is an equal opportunity employer and does not discriminate on the basis of race, national origin, gender, gender identity, sexual orientation, protected veteran status, disability, age, or other legally protected status.
