                - listitem [ref=f251e343]: Autoimmune disorder, for example, lupus, fibromyalgia, rheumatoid arthritis, HIV/AIDS
                - listitem [ref=f251e344]: Blind or low vision
                - listitem [ref=f251e345]: Cancer (past or present)
                - listitem [ref=f251e346]: Cardiovascular or heart disease
                - listitem [ref=f251e347]: Celiac disease
                - listitem [ref=f251e348]: Cerebral palsy
                - listitem [ref=f251e349]: Deaf or serious difficulty hearing
                - listitem [ref=f251e350]: Diabetes
                - listitem [ref=f251e351]: Disfigurement, for example, disfigurement caused by burns, wounds, accidents, or congenital disorders
                - listitem [ref=f251e352]: Epilepsy or other seizure disorder
                - listitem [ref=f251e353]: Gastrointestinal disorders, for example, Crohn's Disease, irritable bowel syndrome
                - listitem [ref=f251e354]: Intellectual or developmental disability
                - listitem [ref=f251e355]: Mental health conditions, for example, depression, bipolar disorder, anxiety disorder, schizophrenia, PTSD
                - listitem [ref=f251e356]: Missing limbs or partially missing limbs
                - listitem [ref=f251e357]: Mobility impairment, benefiting from the use of a wheelchair, scooter, walker, leg brace(s) and/or other supports
                - listitem [ref=f251e358]: Nervous system condition, for example, migraine headaches, Parkinson’s disease, multiple sclerosis (MS)
                - listitem [ref=f251e359]: Neurodivergence, for example, attention-deficit/hyperactivity disorder (ADHD), autism spectrum disorder, dyslexia, dyspraxia, other learning disabilities
                - listitem [ref=f251e360]: Partial or complete paralysis (any cause)
                - listitem [ref=f251e361]: Pulmonary or respiratory conditions, for example, tuberculosis, asthma, emphysema
                - listitem [ref=f251e362]: Short stature (dwarfism)
                - listitem [ref=f251e363]: Traumatic brain injury
