            - heading "Software Engineer - Platforms & Productivity" [level=1] [ref=f251e14]
            - generic [ref=f251e15]: Hybrid
          - button "Apply" [ref=f251e19] [cursor=pointer]
        - generic [ref=f251e20]:
          - generic [ref=f251e21]:
            - heading "About Us" [level=3] [ref=f251e22]
            - paragraph [ref=f251e23]: At Cloudflare, we are on a mission to help build a better Internet. Today the company runs one of the world’s largest networks that powers millions of websites and other Internet properties for customers ranging from individual bloggers to SMBs to Fortune 500 companies. Cloudflare protects and accelerates any Internet application online without adding hardware, installing software, or changing a line of code. Internet properties powered by Cloudflare all have web traffic routed through its intelligent global network, which gets smarter with every request. As a result, they see significant improvement in performance and a decrease in spam and other attacks. Cloudflare was named to Entrepreneur Magazine’s Top Company Cultures list and ranked among the World’s Most Innovative Companies by Fast Company.
            - paragraph [ref=f251e24]: At Cloudflare, we’re not looking for people who wait for a polished roadmap; we’re looking for the builders who see the cracks in the Internet that everyone else has simply learned to live with. We value candidates who have the instinct to spot a "normalized" problem and the AI-native curiosity to create a solution using the latest tools. Our culture is built on iteration, leveraging AI to ship faster today to make it better tomorrow, while ensuring that every improvement, no matter how small, is shared across the team to lift everyone up. If you’re the type of person who values curiosity over bureaucracy, and that AI is a partner in solving tough problems to keep the Internet moving forward, you’ll fit right in.
          - generic [ref=f251e25]:
            - heading "About the Team and Role" [level=3] [ref=f251e26]
            - paragraph [ref=f251e27]: The Developer Productivity team builds internal tools and platforms that improve the velocity and developer experience of Cloudflare's engineering teams. We own developer productivity (code commit to production), developer insights and ADLC metrics, developer infrastructure (CI/CD, build systems), AI-assisted development, and Cloudflare-on-Cloudflare dogfooding.
            - paragraph [ref=f251e28]: This team is responsible for AI-assisted development across all of Cloudflare engineering. Adoption has grown 4–6x in the last year. It's a small team, so you'll have a big surface area and real ownership from day one.
            - paragraph [ref=f251e29]: As a Software Engineer, you will help build and operate internal platforms that help Cloudflare engineers develop, deploy, and run software safely and efficiently. You’ll work across developer tooling, CI/CD, GitOps, and AI-assisted development, including MCP servers, agents, evals, and context engineering.
            - paragraph [ref=f251e30]: You’ll also help govern and enforce Cloudflare’s Engineering Codex by turning engineering standards into automated guardrails, paved paths, and actionable feedback.
            - heading "What You’ll Do" [level=3] [ref=f251e31]
            - paragraph [ref=f251e32]: "- Build developer productivity tools, MCP servers, and AI agents."
            - paragraph [ref=f251e33]: "- Automate Engineering Codex controls through CI/CD checks, templates, and policy-as-code."
            - paragraph [ref=f251e34]: "- Monitor Codex adoption, improve controls, and support remediation and exception workflows."
            - paragraph [ref=f251e35]: "- Improve GitOps, developer experience, platform security, and reliability."
            - paragraph [ref=f251e36]: "- Partner with product teams on architecture and platform adoption."
            - paragraph [ref=f251e37]: "- Respond to and prevent incidents affecting internal platforms."
            - heading "What We’re Looking For" [level=3] [ref=f251e38]
            - paragraph [ref=f251e39]: "- Experience with TypeScript, Go, or Bash."
            - paragraph [ref=f251e40]: "- Strong debugging and source-control skills."
            - paragraph [ref=f251e41]: "- Experience with CI/CD, GitOps, or developer platforms."
            - paragraph [ref=f251e42]: "- Ability to break down complex problems and evaluate trade-offs."
            - paragraph [ref=f251e43]: "- Clear communication and a strong focus on developer experience."
            - heading "Bonus Points" [level=3] [ref=f251e44]
            - paragraph [ref=f251e45]: "- Experience with AI agents, MCP, evals, or LLM-based tooling."
            - paragraph [ref=f251e46]: "- Experience with policy-as-code or compliance automation."
            - paragraph [ref=f251e47]: "- Background in platform engineering or developer productivity."
            - paragraph [ref=f251e48]: "- Experience operating distributed or Kubernetes-based systems."
          - generic [ref=f251e49]:
            - heading "What Makes Cloudflare Special?" [level=3] [ref=f251e50]
            - paragraph [ref=f251e51]: We’re not just a highly ambitious, large-scale technology company. We’re a highly ambitious, large-scale technology company with a soul. Fundamental to our mission to help build a better Internet is protecting the free and open Internet.
            - paragraph [ref=f251e52]:
              - link [ref=f251e53] [cursor=pointer]:
                - /url: https://blog.cloudflare.com/protecting-free-expression-online/
                - strong [ref=f251e54]: Project Galileo
              - text: ": Since 2014, we've equipped more than 2,400 journalism and civil society organizations in 111 countries with powerful tools to defend themselves against attacks that would otherwise censor their work, technology already used by Cloudflare’s enterprise customers--at no cost."
            - paragraph [ref=f251e55]:
              - strong [ref=f251e56]:
                - link "Athenian Project" [ref=f251e57] [cursor=pointer]:
                  - /url: https://www.cloudflare.com/athenian/
              - text: ": In 2017, we created the Athenian Project to ensure that state and local governments have the highest level of protection and reliability for free, so that their constituents have access to election information and voter registration. Since the project, we've provided services to more than 425 local government election websites in 33 states."
            - paragraph [ref=f251e58]:
              - link [ref=f251e59] [cursor=pointer]:
                - /url: https://1.1.1.1/
                - strong [ref=f251e60]: 1.1.1.1
              - text: ": We released"
              - link "1.1.1.1" [ref=f251e61] [cursor=pointer]:
                - /url: https://1.1.1.1/
              - text: to help fix the foundation of the Internet by building a faster, more secure and privacy-centric public DNS resolver. This is available publicly for everyone to use - it is the first consumer-focused service Cloudflare has ever released. Here’s the deal - we don’t store client IP addresses never, ever. We will continue to abide by our
              - link "privacy commitment" [ref=f251e62] [cursor=pointer]:
                - /url: https://developers.cloudflare.com/1.1.1.1/privacy/public-dns-resolver
              - text: and ensure that no user data is sold to advertisers or used to target consumers.
            - paragraph [ref=f251e63]: Sound like something you’d like to be a part of? We’d love to hear from you!
            - paragraph [ref=f251e64]: Please note that applicants who progress to the offer stage of the interview process may be asked to attend an in-person interview within one of the Cloudflare Offices or Cloudflare Hubs. More details about this will be available at that stage of the interview process.
            - paragraph [ref=f251e65]: This position may require access to information protected under U.S. export control laws, including the U.S. Export Administration Regulations. Please note that any offer of employment may be conditioned on your authorization to receive software or technology controlled under these U.S. export laws without sponsorship for an export license.
            - paragraph [ref=f251e66]: Cloudflare is proud to be an equal opportunity employer. We are committed to providing equal employment opportunity for all people and place great value in both diversity and inclusiveness. All qualified applicants will be considered for employment without regard to their, or any other person's, perceived or actual race, color, religion, sex, gender, gender identity, gender expression, sexual orientation, national origin, ancestry, citizenship, age, physical or mental disability, medical condition, family care status, or any other basis protected by law. We are an AA/Veterans/Disabled Employer.
            - paragraph [ref=f251e67]: Cloudflare provides reasonable accommodations to qualified individuals with disabilities. Please tell us if you require a reasonable accommodation to apply for a job. Examples of reasonable accommodations include, but are not limited to, changing the application process, providing documents in an alternate format, using a sign language interpreter, or using specialized equipment. If you require a reasonable accommodation to apply for a job, please contact us via e-mail at hr@cloudflare.com or via mail at 101 Townsend St. San Francisco, CA 94107.
