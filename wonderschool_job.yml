              - strong [ref=f327e108]: About Wonderschool
              - text: Wonderschool’s mission is to ensure every child has access to early childhood education that helps them realize their full potential. We empower small business owners, childcare providers, to launch and grow programs through software, coaching, and support, while partnering with governments to modernize childcare infrastructure. We are building a category-defining platform at the intersection of marketplace, SaaS, and public sector systems, now increasingly powered by AI. Our products help providers run and grow their businesses, from enrollment and marketing to licensing, compliance, and daily operations. Our team is small, fast-moving, and deeply focused on building systems that scale. We value people who take ownership, experiment quickly, and use modern tools, including AI and automation, to increase their leverage and impact.
              - strong [ref=f327e109]: Position Summary
              - text: This role builds the core systems that power Wonderschool’s platform, enabling providers to launch and grow their businesses, governments to operate programs at scale, and families to access care. As a Senior Full Stack Engineer, you will own features end-to-end, working across frontend, backend, and data layers to deliver high-quality, scalable products. You will operate as a builder, partnering closely with product, design, and go-to-market teams to turn real-world problems into simple, effective solutions. Success in this role means shipping quickly, improving system reliability, and leveraging modern tools, including AI, to increase development velocity and product impact.
              - strong [ref=f327e110]: Responsibilities
              - strong [ref=f327e111]: Build and Own Product End-to-End
              - list [ref=f327e112]:
                - listitem [ref=f327e113]: Design, build, and ship full-stack features that improve provider, parent, and government experiences
                - listitem [ref=f327e114]: Own the full development lifecycle, from scoping and architecture to implementation and production support
                - listitem [ref=f327e115]: Write high-quality, maintainable code with strong test coverage
                - listitem [ref=f327e116]: Debug and resolve production issues across the stack
              - strong [ref=f327e117]: Drive Product Impact
              - list [ref=f327e118]:
                - listitem [ref=f327e119]: Partner closely with Product, Design, and Data to build features that solve real customer problems
                - listitem [ref=f327e120]: Develop a deep understanding of customer workflows and use cases
                - listitem [ref=f327e121]: Contribute to product decisions through technical insight and tradeoff analysis
                - listitem [ref=f327e122]: Work closely with GTM teams to understand user needs and improve product outcomes
              - strong [ref=f327e123]: Improve Systems and Scale
              - list [ref=f327e124]:
                - listitem [ref=f327e125]: Design systems and data models that support complex workflows and integrations
                - listitem [ref=f327e126]: Improve performance, scalability, and reliability of the platform
                - listitem [ref=f327e127]: Contribute to architecture decisions and technical direction
                - listitem [ref=f327e128]: Help evolve engineering standards, tooling, and best practices
              - strong [ref=f327e129]: Increase Engineering Leverage
              - list [ref=f327e130]:
                - listitem [ref=f327e131]: Use AI tools, automation, and modern development workflows to increase speed and efficiency
                - listitem [ref=f327e132]: Identify opportunities to reduce manual work and improve developer productivity
                - listitem [ref=f327e133]: Contribute to a culture of rapid iteration and continuous improvement
              - strong [ref=f327e134]: Required Qualifications
              - list [ref=f327e135]:
                - listitem [ref=f327e136]: 6+ years of experience as a full stack engineer
                - listitem [ref=f327e137]: Strong experience with modern frontend technologies (React, TypeScript, JavaScript)
                - listitem [ref=f327e138]: Proficiency with backend systems (Node.js, Ruby on Rails, Elixir, or similar)
                - listitem [ref=f327e139]: Experience working with relational databases (Postgres or similar)
                - listitem [ref=f327e140]: Proven ability to deliver high-quality code with strong testing practices
                - listitem [ref=f327e141]: Experience building and shipping production systems end-to-end
                - listitem [ref=f327e142]: Strong collaboration and communication skills
              - strong [ref=f327e143]: Preferred Qualifications
              - list [ref=f327e144]:
                - listitem [ref=f327e145]: Experience building complex or enterprise-grade systems with multiple integrations
                - listitem [ref=f327e146]: Experience designing APIs (REST or GraphQL)
                - listitem [ref=f327e147]: Familiarity with cloud infrastructure, containerization, or serverless architectures
                - listitem [ref=f327e148]: Experience with CI/CD pipelines and DevOps practices
                - listitem [ref=f327e149]: Experience working in fast-paced, high-growth environments
                - listitem [ref=f327e150]: Experience incorporating AI into products or development workflows
              - strong [ref=f327e151]: Compensation & Benefits
              - text: "Compensation Range (California): The base salary range for this role is $180,000 – $220,000, depending on experience, skills, and location. This role may also be eligible for equity and other forms of compensation."
              - strong [ref=f327e152]: Wonderschool Offers a Competitive Benefits Package, Including
              - list [ref=f327e153]:
                - listitem [ref=f327e154]: Health benefits with up to 100% coverage for employee premiums and up to 80% for dependents
                - listitem [ref=f327e155]: Wifi and employee wellness stipends
                - listitem [ref=f327e156]: Flexible PTO, paid holidays, and mental wellness days
                - listitem [ref=f327e157]: Competitive parental leave (eligible after 6 months of employment)
                - listitem [ref=f327e158]: A highly collaborative, mission-driven workplace environment
              - strong [ref=f327e159]: Location / Travel Expectations
              - text: This role is based in our office in Rincon Hill, San Francisco. We work in-office 5-6 days a week to enable close collaboration across engineering, product, and leadership teams.
