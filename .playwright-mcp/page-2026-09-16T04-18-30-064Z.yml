                  - text: Tax-efficient transit and commuting support for hybrid and in-office employees
                - listitem [ref=f374e176]:
                  - strong [ref=f374e177]: "Autonomy and Agency:"
                  - text: Play a meaningful role in scaling a category-defining GenAI platform transforming the future of customer experience.
              - paragraph [ref=f374e178]:
                - strong [ref=f374e179]: Salary Range
              - paragraph [ref=f374e180]:
                - text: The base salary compensation range targeted for this full-time position is
                - strong [ref=f374e181]: $145 - 165K
                - strong [ref=f374e182]
                - text: per year. Compensation may vary outside of this range depending on a number of factors, including a candidate’s qualifications, skills, competencies and experience. Base pay is one part of the Total Package that is provided to compensate and recognize employees for their work, and this role may be eligible for additional discretionary bonuses/incentives and equity (in the form of options). This salary range is an estimate, and the actual salary may vary based on the Company’s compensation practices.
              - paragraph [ref=f374e183]:
                - strong [ref=f374e184]: Our Commitment to Inclusion and Belonging
              - paragraph [ref=f374e185]:
                - emphasis [ref=f374e186]: Observe.AI is an Equal Employment Opportunity employer that proudly pursues and hires a diverse workforce. Observe.AI does not make hiring or employment decisions on the basis of race, color, religion or religious belief, ethnic or national origin, nationality, sex, gender, gender identity, sexual orientation, disability, age, military or veteran status, or any other basis protected by applicable local, state, or federal laws or prohibited by Company policy. Observe.AI also strives for a healthy and safe workplace and strictly prohibits harassment of any kind.
              - paragraph [ref=f374e187]:
                - emphasis [ref=f374e188]: We welcome all people. We celebrate diversity of all kinds and are committed to creating an inclusive culture built on a foundation of respect for all individuals. We seek to hire, develop, and retain talented people from all backgrounds. Individuals from non-traditional backgrounds, historically marginalized or underrepresented groups are strongly encouraged to apply.
              - paragraph [ref=f374e189]:
