              - paragraph [ref=f374e97]:
                - strong [ref=f374e98]: About Us
              - paragraph [ref=f374e99]: Observe.AI is the AI Agents platform for customer experience, designed to help organizations deliver faster, smarter, and more efficient customer service at scale. The platform enables businesses to deploy specialized AI Agents that autonomously execute work across the full CX lifecycle—from handling customer conversations to supporting frontline teams and optimizing operations.
              - paragraph [ref=f374e100]: Each AI Agent is purpose-built for a specific role, equipped to understand context, make decisions, take action, and continuously improve outcomes. This allows organizations to increase resolution speed, elevate service quality, and reduce operational costs while empowering your frontline team to focus on higher-value work.
              - paragraph [ref=f374e101]: Built on a CX-native foundation, Observe.AI helps leading brands like DoorDash, Affordable Care, Signify Health, and Verida improve customer satisfaction, boost agent productivity, and deliver consistent, scalable performance across every customer interaction.
              - paragraph [ref=f374e102]:
                - strong [ref=f374e103]: Why Join Us
              - paragraph [ref=f374e104]: We are looking for a Software Engineer I to help build and improve enterprise AI agent products. You will work with experienced engineers to develop backend services, integrate Large Language Models, connect AI agents with external systems, and improve the reliability and performance of production applications.
              - paragraph [ref=f374e105]: This is an entry-level role suitable for a recent graduate or an engineer with up to three years of software development experience.
              - paragraph [ref=f374e106]:
                - strong [ref=f374e107]: What You’ll Be Doing
              - paragraph [ref=f374e108]:
                - strong [ref=f374e109]: Software Development
              - list [ref=f374e110]:
                - listitem [ref=f374e111]: Build and maintain services using Python , typescript, golang.
                - listitem [ref=f374e112]: Develop APIs and integrations with internal and external systems.
                - listitem [ref=f374e113]: Write clean, readable, tested, and maintainable code.
                - listitem [ref=f374e114]: Debug application issues and contribute to production fixes.
                - listitem [ref=f374e115]: Participate in code reviews, technical discussions, and engineering planning.
              - text: AI Agent Development
              - list [ref=f374e116]:
                - listitem [ref=f374e117]: Help develop core pipeline for conversational AI agents.
                - listitem [ref=f374e118]: Build prompts, tools, workflows, and conversation logic for AI agents.
                - listitem [ref=f374e119]: Support Retrieval-Augmented Generation using documents, embeddings, and vector databases.
                - listitem [ref=f374e120]: Create tests and evaluations to measure agent accuracy and reliability.
              - strong [ref=f374e122]: Voice and Real-Time Systems
              - list [ref=f374e123]:
                - listitem [ref=f374e124]: Contribute to voice AI pipelines involving Speech-to-Text and Text-to-Speech systems.
                - listitem [ref=f374e125]: Help integrate voice agents with telephony and contact-center platforms.
                - listitem [ref=f374e126]: Investigate latency, audio-quality, and conversation-flow issues.
                - listitem [ref=f374e127]: Learn and work with real-time communication technologies such as WebSockets, WebRTC, SIP, or RTP.
              - strong [ref=f374e129]: Production and Platform Engineering
              - list [ref=f374e130]:
                - listitem [ref=f374e131]: Monitor services using logs, metrics, traces, and dashboards.
                - listitem [ref=f374e132]: Help improve system reliability, performance, and cost efficiency.
                - listitem [ref=f374e133]: Work with Docker, Kubernetes, cloud infrastructure, and CI/CD pipelines.
                - listitem [ref=f374e134]: Document technical designs, APIs, operational procedures, and troubleshooting steps.
              - text: Collaboration
              - list [ref=f374e135]:
                - listitem [ref=f374e136]: Work closely with product managers, senior engineers, and implementation teams.
                - listitem [ref=f374e137]: Understand customer requirements and translate them into technical solutions.
                - listitem [ref=f374e138]: Communicate progress, risks, dependencies, and technical trade-offs clearly.
                - listitem [ref=f374e139]: Learn from feedback and take increasing ownership of product areas.
              - paragraph [ref=f374e140]
              - paragraph [ref=f374e141]:
                - strong [ref=f374e142]: What You’ll Bring To The Role
              - list [ref=f374e143]:
                - listitem [ref=f374e144]: Bachelor’s degree in Computer Science, Software Engineering, or a related technical field.
                - listitem [ref=f374e145]: Up to three years of software development experience, including internships or academic projects.
                - listitem [ref=f374e146]: Strong programming fundamentals and problem-solving skills.
                - listitem [ref=f374e147]: Experience with Python, JavaScript, TypeScript, golan, or a similar asynchronous programming language.
                - listitem [ref=f374e148]: Understanding of data structures, algorithms, APIs, databases, and object-oriented programming.
                - listitem [ref=f374e149]: Familiarity with Git and standard software development practices.
                - listitem [ref=f374e150]: Ability to learn new technologies and work effectively in a collaborative environment
              - paragraph [ref=f374e151]: "*Preferred Not Required"
              - list [ref=f374e152]:
                - listitem [ref=f374e153]: Event-driven systems and message queues such as Kafka, RabbitMQ, or SQS.
                - listitem [ref=f374e154]: Speech-to-Text, Text-to-Speech, WebRTC, SIP, Twilio, or contact-center platforms.
                - listitem [ref=f374e155]: Monitoring tools such as Datadog, Prometheus, or Grafana.
                - listitem [ref=f374e156]: Personal, academic, or open-source projects involving AI or distributed systems.
              - paragraph [ref=f374e157]:
                - strong [ref=f374e158]: Why You’ll Love It Here
              - list [ref=f374e159]:
                - listitem [ref=f374e160]:
                  - strong [ref=f374e161]: "Competitive compensation including equity:"
                  - text: Market-aligned base pay, performance incentives, and meaningful equity ownership
                - listitem [ref=f374e162]:
                  - strong [ref=f374e163]: "Excellent medical, dental, and vision insurance options:"
                  - text: Comprehensive medical, dental and vision benefits for employees and eligible dependents
                - listitem [ref=f374e164]:
                  - strong [ref=f374e165]: "Flexible Paid Time Off:"
                  - text: Our unlimited, flexible PTO policy empowers you to take the time you need to recharge, maintain balance, and perform at your best.
                - listitem [ref=f374e166]:
                  - strong [ref=f374e167]: "Additional Time to Recharge:"
                  - text: 10 company holidays, an annual company-wide Winter Break, and paid parental leave to fully support life outside of work.
                - listitem [ref=f374e168]:
                  - strong [ref=f374e169]: "401(k) plan:"
                  - text: Long-term financial planning support with tax-advantaged retirement savings
                - listitem [ref=f374e170]:
                  - strong [ref=f374e171]: "Quarterly Lifestyle Spending Account:"
                  - text: Flexible quarterly stipend to support wellness, learning and professional development, and personal growth
                - listitem [ref=f374e172]:
