                - strong [ref=f287e109]: About The Role
              - text: The Full Stack Engineer at iCapital will work end-to-end on new features, enhancements, and defect resolution on one or more of iCapital's software platforms. You will work closely with our Product Management team throughout the software development process, detailing requirements, reviewing work in progress, and addressing issues found in manual test efforts.
              - strong [ref=f287e110]:
                - strong [ref=f287e111]: Responsibilities
              - list [ref=f287e112]:
                - listitem [ref=f287e113]: Web application development in React as front end and Ruby on Rails as a backend.
                - listitem [ref=f287e114]: Strong grasp of system design, architecture, and trade-offs. Able to mentor junior engineers effectively.
                - listitem [ref=f287e115]: Participate in architecture reviews and technical design.
                - listitem [ref=f287e116]: Active participation in daily stand-up meetings
                - listitem [ref=f287e117]: Active participation in Peer Code Reviews as part of our standard SDLC and Change
              - strong [ref=f287e118]:
                - strong [ref=f287e119]: Qualifications
              - list [ref=f287e120]:
                - listitem [ref=f287e121]: 3+ years software engineering experience building enterprise SaaS cloud-based solutions
                - listitem [ref=f287e122]: 2+ years of Ruby on Rails development experience or 3+ years of Python development experience
                - listitem [ref=f287e123]: 2+ years of hands-on experience with modern JS frameworks such as React
                - listitem [ref=f287e124]: 2+ years of front end and back-end test automation development using RSpec, Cucumber or similar
                - listitem [ref=f287e125]: Demonstrated understanding of relational database concepts and modeling practices.
                - listitem [ref=f287e126]: Familiarity with cloud-based technologies – K8S, AWS etc.
                - listitem [ref=f287e127]: Ability to work in an Agile / Kanban methodology
                - listitem [ref=f287e128]: Ability to work independently or as part of a group effort, as required
                - listitem [ref=f287e129]: Solid problem-solving ability
                - listitem [ref=f287e130]: Excellent communication skills
                - listitem [ref=f287e131]: Collaborative approach to software development
              - strong [ref=f287e132]:
                - strong [ref=f287e133]: Benefits
              - text: "The base salary range for this role is $90,000 to $110,000 depending on level. iCapital offers a compensation package which includes salary, equity for all full-time employees, and an annual performance bonus. Employees also receive a comprehensive benefits package that includes an employer matched retirement plan, generously subsidized healthcare with 100% employer paid dental, vision, telemedicine, and virtual mental health counseling, parental leave, and unlimited paid time off (PTO). We believe the best ideas and innovation happen when we are together. Employees in this role will work in the office Monday-Thursday, with the flexibility to work remotely on Friday. For additional information on iCapital, please visit https://www.icapitalnetwork.com/about-us Twitter: @icapitalnetwork | LinkedIn: https://www.linkedin.com/company/icapital-network-inc | Awards Disclaimer: https://www.icapitalnetwork.com/about-us/recognition/ iCapital is proud to be an Equal Employment Opportunity and Affirmative Action employer. We do not discriminate based upon race, religion, color, national origin, gender, sexual orientation, gender identity, age, status as a protected veteran, status as an individual with a disability, or other applicable legally protected characteristics."
