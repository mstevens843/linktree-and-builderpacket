          - generic [ref=f22e34]:
            - paragraph [ref=f22e35]:
              - link "Phantom" [ref=f22e36] [cursor=pointer]:
                - /url: https://phantom.com
              - text: is on a mission to connect the world to the freedom of open markets. Tens of millions of people all over the world use Phantom to access global markets that never close, including perpetuals, prediction markets, tokenized assets, stablecoins and memes. Phantom users are able to discover the markets that matter and the cultural moments that shape them, building conviction through real-time data and the verified performance of top traders. With self-custody and access to open networks at its core, Phantom lets them control their financial moves in the same app they use to safely store or spend money worldwide.
            - paragraph [ref=f22e37]: "Phantom has reached #1 in Google Play's finance category and consistently ranks in the top 50 apps across all categories. Phantom partners with many of the most trusted and influential names in finance like Hyperliquid, Stripe, Kalshi and Visa, to make the most popular and innovative financial products accessible to everyone."
            - paragraph [ref=f22e38]: We are around 180 people, fully remote, backed by a $150M Series C investment from a16z, Sequoia Capital and Paradigm.
            - paragraph [ref=f22e39]
            - heading "Role Description" [level=2] [ref=f22e40]
            - paragraph [ref=f22e41]: "Identity Platform is the trust root of Phantom: we own authentication, unlocking, onboarding/key generation, and the signing pipeline that every transaction flows through. This is a business-critical area where bugs can lock users out or put funds at risk. You'll ship TypeScript across browser, Node.js, and mobile runtimes (e.g., Hermes) to keep these foundations fast, secure, and reliable."
            - paragraph [ref=f22e42]
            - heading "Responsibilities" [level=2] [ref=f22e43]
            - list [ref=f22e44]:
              - listitem [ref=f22e45]:
                - paragraph [ref=f22e46]: Own and evolve the signing path for every transaction in Phantom.
              - listitem [ref=f22e47]:
                - paragraph [ref=f22e48]: Build and harden authentication, unlocking, biometrics, and account access flows across web and mobile.
              - listitem [ref=f22e49]:
                - paragraph [ref=f22e50]: Ship passkeys (WebAuthn) and MFA improvements with a strong security/usability balance.
              - listitem [ref=f22e51]:
                - paragraph [ref=f22e52]: "Own onboarding and key lifecycle flows: key generation/derivation, seed phrase flows, seedless registration, hardware wallet pairing."
              - listitem [ref=f22e53]:
                - paragraph [ref=f22e54]: Own sensitive key export/import experiences and related safety rails.
              - listitem [ref=f22e55]:
                - paragraph [ref=f22e56]: Write and maintain high-signal, non-flaky tests (unit/integration/e2e) for critical paths; ensure safe rollouts via monitoring and staged releases.
            - paragraph [ref=f22e57]
            - heading "Qualifications" [level=2] [ref=f22e58]
            - paragraph [ref=f22e59]:
              - strong [ref=f22e60]: Must-have
            - list [ref=f22e61]:
              - listitem [ref=f22e62]:
                - paragraph [ref=f22e63]: 7+ years of experience
              - listitem [ref=f22e64]:
                - paragraph [ref=f22e65]: Strong TypeScript skills; comfortable shipping code across browser, Node.js, and mobile JS runtimes.
              - listitem [ref=f22e66]:
                - paragraph [ref=f22e67]: Proven ability to build high-signal, low-flake test suites for critical systems.
              - listitem [ref=f22e68]:
                - paragraph [ref=f22e69]: Familiarity with auth concepts and common mechanisms (sessions/tokens, MFA/OTP, WebAuthn/passkeys)
              - listitem [ref=f22e70]:
                - paragraph [ref=f22e71]: "Strong engineering fundamentals: system design, debugging, and production reliability."
            - paragraph [ref=f22e72]:
              - strong [ref=f22e73]: Nice-to-have
            - list [ref=f22e74]:
              - listitem [ref=f22e75]:
                - paragraph [ref=f22e76]: Deeper experience with OAuth2/OIDC, WebAuthn internals, cryptography, or key management systems.
              - listitem [ref=f22e77]:
                - paragraph [ref=f22e78]: Web3/wallet or signing-flow experience.
              - listitem [ref=f22e79]:
                - paragraph [ref=f22e80]: Security- or money-adjacent experience (identity, payments, custody).
              - listitem [ref=f22e81]:
                - paragraph [ref=f22e82]: Rust experience (or strong interest in learning it).
            - paragraph [ref=f22e83]
            - heading "Why Work with Us" [level=2] [ref=f22e84]
            - paragraph [ref=f22e85]: We are a team of experienced builders in the blockchain and crypto industry. Our journey began from users seeking an easy, seamless path to accessing the crypto ecosystem. This passion fueled our exponential growth, allowing us to onboard over 20M+ active users in just over three years; with our user base growing weekly. Our dedication to a secure and seamless user experience has made us the leading wallet on Solana as well as our multi-chain approach enhances our platform's versatility, meeting the needs of a diverse and growing user base. By staying at the forefront of technology and user expectations, we continue to innovate and set industry standards on self-custodial crypto wallets.
            - paragraph [ref=f22e86]: There has never been a better time to work in crypto to help shape the future of innovation with a focus around the wallet experience!
            - list [ref=f22e87]:
              - listitem [ref=f22e88]:
                - paragraph [ref=f22e89]:
                  - strong [ref=f22e90]: "First impressions matter:"
                  - text: Wallets are responsible for a users first impression with crypto and onboarding new users into crypto. By ensuring that a user has a great first-time experience with crypto, we can help supercharge the growth of the entire ecosystem.
              - listitem [ref=f22e91]:
                - paragraph [ref=f22e92]:
                  - strong [ref=f22e93]: "Make crypto easier to navigate:"
                  - text: There is no easy way for a user to discover and navigate all that crypto has to offer. Wallets have a unique opportunity to help users not only onboard to crypto but also stay retained by exploring new things to do.
              - listitem [ref=f22e94]:
                - paragraph [ref=f22e95]:
                  - strong [ref=f22e96]: "We live in a multi-chain world:"
                  - text: We currently support Solana, Ethereum, Polygon and Bitcoin with more networks to come in the new future. We are focused on creating a unified, multi-chain crypto experience for users.
            - paragraph [ref=f22e97]
            - heading "Benefits" [level=2] [ref=f22e98]
            - list [ref=f22e99]:
              - listitem [ref=f22e100]:
                - paragraph [ref=f22e101]: Competitive salary and equity
              - listitem [ref=f22e102]:
                - paragraph [ref=f22e103]: Comprehensive insurance (medical/dental/vision)- Employee 100% covered
              - listitem [ref=f22e104]:
                - paragraph [ref=f22e105]: Stipend for your ideal remote set-up
              - listitem [ref=f22e106]:
                - paragraph [ref=f22e107]: Flexible hours and a supportive remote environment
              - listitem [ref=f22e108]:
                - paragraph [ref=f22e109]: "Unlimited vacation: Take time when you need it (and we really mean it!)"
              - listitem [ref=f22e110]:
                - paragraph [ref=f22e111]: 401(k) retirement plan
              - listitem [ref=f22e112]:
                - paragraph [ref=f22e113]: Monthly wellness benefit
              - listitem [ref=f22e114]:
                - paragraph [ref=f22e115]: Weekly meal benefit
              - listitem [ref=f22e116]:
                - paragraph [ref=f22e117]: Global off-sites
            - paragraph [ref=f22e118]
            - paragraph [ref=f22e119]:
              - strong [ref=f22e120]: We strongly encourage candidates of all backgrounds to apply.
              - text: We believe that our work is stronger with a variety of perspectives, and we’re eager to further diversify our company. If you have a background that you feel would make an impact at Phantom, please consider applying. We’re committed to building an inclusive, supportive place for you to do the best work of your career.
            - paragraph [ref=f22e121]
            - paragraph [ref=f22e122]:
              - emphasis [ref=f22e123]: By submitting your resume and application materials, you acknowledge and agree that Phantom Technologies, Inc. ("Phantom") collects and processes your personal information (including application materials, interview records, and related data) to evaluate your candidacy. Phantom may use AI-powered tools and third-party service providers for transcription, note-taking, scheduling, and other administrative tasks. Phantom does not sell your information and your materials will be handled securely and in accordance with applicable data protection laws.
