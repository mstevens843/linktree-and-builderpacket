              - heading "About Drift" [level=4] [ref=f8e119]
              - generic [ref=f8e120]: Drift is one of the leading decentralized derivatives exchanges on Solana, built for serious traders. We offer lightning-fast, capital-efficient perpetual trading and innovative earning products like Strategy Vaults and Amplify. We’re backed by top crypto-native funds and building for the next generation of DeFi traders.
