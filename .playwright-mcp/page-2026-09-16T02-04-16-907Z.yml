              - generic [ref=f18e68]: "Last edited: 28 December 2023"
              - generic [ref=f18e80]: 💼 Mid-Level 🌎 Remote / Sydney / San Francisco / New York / Singapore 📃 Infrastructure Engineer - Drift Protocol 💵 120-170k package
              - generic [ref=f18e92]: About Drift Labs
              - generic [ref=f18e98]: Drift Labs is the core contributor to Drift Protocol, the largest perpetuals DEX on Solana. Drift Protocol’s goal is to make DEXs the best way to trade derivatives. Despite the decentralized nature of crypto, centralized derivatives exchanges still remain dominant - they're already fast, familiar and reliable however lack immutability and transparency.
              - generic [ref=f18e110]: Drift’s vision is to create a centralised user experience built on decentralised rails. We’re backed by Multicoin Capital, Polychain Ventures, Ethereal and many more. The team is made up of experienced traders and builders from DeFi and traditional finance working to make this a reality.
              - generic [ref=f18e122]: The Opportunity
              - generic [ref=f18e128]: Drift is looking for an Infrastructure Engineer to be a core member of our engineering team. You will build and maintain our decentralized perpetual futures platform across our back end and off-chain infrastructure. You’ll help determine the back end strategy as well as implement it, enabling our back end infrastructure technology that revolutionizes the way we trade digital assets.
              - generic [ref=f18e134]: Drift Labs pays a competitive salary with upside potential.
              - generic [ref=f18e146]: Your Role
              - generic [ref=f18e155]:
                - generic [ref=f18e156]: •
                - generic [ref=f18e158]: "Off-chain services: Design, build and maintain efficient and reliable off-chain web services that are optimised for speed (e.g. liquidators and arbitrage bots, indexing transaction history, etc)"
              - generic [ref=f18e164]:
                - generic [ref=f18e165]: •
                - generic [ref=f18e167]: "Back-End Infrastructure Processes: Operationalize existing off-chain web services by improving processes and implementing operational strategies around monitoring, alarming, etc"
              - generic [ref=f18e173]:
