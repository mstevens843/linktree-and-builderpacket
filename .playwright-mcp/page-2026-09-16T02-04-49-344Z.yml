            - paragraph [ref=f14e34]: "Location: Remote"
            - paragraph [ref=f14e35]: Orca is expanding into new product verticals, bringing a new class of regulated assets on-chain with the compliance infrastructure and liquidity primitives to make them actually work. Our ambition reaches beyond becoming the leading provider of financial primitives in crypto—we aim to reshape the foundation of finance itself. If you are someone who is tired of just working another job and wants to build something meaningful, then we invite you to join our team.
            - paragraph [ref=f14e36]: We’re always looking for talented individuals to join our growing team. If you think your skills can contribute to Orca's mission, but don’t see a specific role that matches your expertise in our current open positions, we’d love to hear from you. By submitting your resume here, you’ll be considered for future opportunities that align with your background and interests.If there’s a potential fit for an existing or upcoming opportunity, our team will get in touch. While we’d love to respond to everyone, we’re unfortunately unable to provide individual updates on all open applications.
