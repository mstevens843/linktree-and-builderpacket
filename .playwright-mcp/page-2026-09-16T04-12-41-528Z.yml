        - generic [ref=f91e100]:
          - generic [ref=f91e102]:
            - generic [ref=f91e103]:
              - text: "Pylon — the agentic support platform purpose-built for B2B. Pylon is the only agentic support platform, purpose-built for B2B companies. For leaders scaling AI-native support teams, Pylon lets humans and agents collaborate on customer work – investigating, resolving, and acting on every signal across every channel that matters. Unlike platforms built before the AI era, Pylon enriches every interaction with deep account-level context, automates the low impact customer work, and surfaces answers before your team even has to ask. The result: faster responses, happier customers, and a system that continuously improves itself. We're backed by a16z, BCV, General Catalyst, and Y Combinator. More than 1,500 companies including Linear, Cognition (makers of Devin), Modal Labs, and Incident.io run their support and customer success workflows on Pylon. We're also featured on the Enterprise Tech 30 List. What You'll Do"
              - list [ref=f91e104]:
                - listitem [ref=f91e105]: Build features so our customers in post-Sales roles (Customer Support & Customer Success) run their operations more efficiently by leveraging AI
                - listitem [ref=f91e106]: Build prototypes, work independently, iterate quickly, and ship fast
                - listitem [ref=f91e107]: Have high autonomy, own things end to end, and project manage your own work
                - listitem [ref=f91e108]: Work with PMs, designers, and other engineers in a highly collaborative, non-waterfall way
                - listitem [ref=f91e109]: Collaborate with a strong technical team of senior engineers from places like Samsara, Affinity, Airbnb, and Meta
              - text: What We’re Looking For
              - list [ref=f91e110]:
                - listitem [ref=f91e111]: You have 3+ years building product features and a demonstration of strong full-stack fundamentals
                - listitem [ref=f91e112]: You highly leverage AI for software development and can juggle multiple workstreams at the same time.
                - listitem [ref=f91e113]: You’ve worked at startups previously and navigated ambiguous environments.
                - listitem [ref=f91e114]: You have a strong product sense and are able to quickly translate customer requirements into technical decisions in our codebase.
                - listitem [ref=f91e115]: You have a growth mindset, want to constantly improve, and want to receive feedback.
                - listitem [ref=f91e116]: You're in SF or you're willing to relocate, you love working in-person, and you're serious about joining us to build a culture we'll all love
                - listitem [ref=f91e117]: (Bonus) You have experience with our tech stack (React, Golang, GraphQL, and AWS).
                - listitem [ref=f91e118]: (Bonus) You have experience with building agentic products in production.
              - strong [ref=f91e119]: Our Perks
              - text: 🚆 Commuter benefits 🌱 Parental leave 🏝️ 14 company holidays + unlimited PTO 🗺️ Annual offsite 🍽 Lunch, dinner, and snacks at the office 🏋️ Fitness stipend
              - strong [ref=f91e120]: More About Pylon
              - strong [ref=f91e121]: "Funding:"
              - text: Series B led by a16z and BCV ($51M total raised)
              - strong [ref=f91e122]: "Founders:"
              - text: Advith Chelikani, Robert Eng, and Marty Kausas
              - strong [ref=f91e123]: "Team:"
              - text: Currently 100+ and growing!
              - strong [ref=f91e124]: Additional Job Details
              - text: "The base salary range for this position is $180k - $280k annually. Compensation may vary outside of this range depending on a number of factors, including a candidate’s qualifications, skills, competencies and experience. Base pay is one part of the Total Package that is provided to compensate and recognize employees for their work at Pylon. This role is eligible for stock options, as well as a comprehensive benefits package. Compensation Range: $180K - $280K"
