        - generic [ref=f51e117]:
          - generic [ref=f51e119]:
            - generic [ref=f51e120]:
              - strong [ref=f51e121]: A Better Built World
              - text: "At Miter, we’re on a mission to help construction contractors build with confidence. If we’re successful, we’ll make it easier and faster to build critical physical infrastructure - roads, bridges, utilities, data centers, housing, etc. For decades, construction and field services contractors have had to run their businesses on outdated software: clunky, on-premise systems created in the 1980s and 1990s. That’s where Miter comes in. We’re using AI and embedded payments to rebuild the core HR, finance, and operations systems that underpin our physical economy. Using Miter, contractors like Marathon Electrical, W.J. O’Neil, and Truebeck Construction are building stronger teams, controlling job costs, and accelerating jobsite execution. This idea is resonating. Since we launched in 2021, we’ve grown to thousands of customers and tens of millions in ARR, making us one of the fastest growing vertical software companies ever. To double-down on our momentum, we’ve raised $50M+ from top investors (Bessemer, Coatue, and Battery) who share our belief that we’re just getting started."
              - strong [ref=f51e122]:
                - strong [ref=f51e123]: "About the Team and How We Work:"
              - text: Building the OS for the built world is no small feat. We’ll need to ship a LOT of high quality code in the coming years, and to do so, we’re building an engineering culture centered around craft, ownership, and collaboration. >25% of our engineers and product managers are ex-founders, and we hire for slope, not intercept. Being a place where
              - emphasis [ref=f51e124]: you can just build things
              - text: "requires talent density and some unique ways of doing things. A few ways we’re different:"
              - list [ref=f51e125]:
                - listitem [ref=f51e126]: "No rules…rules: Many engineering teams design processes and rules around the lowest common denominator. Not us! We trust brilliant engineers to deliver magical customer outcomes and introduce processes and rules only when necessary."
                - listitem [ref=f51e127]: "Full-full-stack: Our technology stack (TypeScript everywhere!) and processes are designed to encourage engineers to run their projects end-to-end. This usually involves writing technical blueprints, implementing full-stack solutions, and talking to customers directly to get feedback."
                - listitem [ref=f51e128]: "Lean and AI-native: AI is turning 10x engineers into 100x engineers. We believe lean, talent-dense, AI-native teams will outship much larger teams with less talent density."
                - listitem [ref=f51e129]: "Blueprints and building blocks: One of our core Miter values is “build the blueprint”. Writing things down clarifies our thinking and aligns our teams. This also applies to building fundamental building blocks and abstractions that make developers’ lives easier."
                - listitem [ref=f51e130]: "We feel our customers’ pain and celebrate their success: We encourage engineers to build direct relationships with customers, feel their pain, and celebrate their success. We love fast feedback loops."
                - listitem [ref=f51e131]: "We’re meritocratic: We value results and hard work. We reward engineers who consistently ship and deliver for customers with increased scope and compensation."
              - strong [ref=f51e132]:
                - strong [ref=f51e133]: "What You'll Do:"
              - list [ref=f51e134]:
                - listitem [ref=f51e135]: Design, build, and maintain products/systems that power our core platform.
                - listitem [ref=f51e136]: Collaborate with product managers and other engineers to deliver high-quality experiences.
                - listitem [ref=f51e137]: Actively participate in blueprinting, code reviews, and technical documentation for your team.
              - strong [ref=f51e138]:
                - strong [ref=f51e139]: "What You'll Need:"
              - list [ref=f51e140]:
                - listitem [ref=f51e141]: 0-1 years of professional software development experience.
                - listitem [ref=f51e142]: Strong problem-solving skills.
                - listitem [ref=f51e143]: A growth mindset and curiosity to understand business context and user needs.
                - listitem [ref=f51e144]: Strong work ethic and reliability when owning tasks and deliverables.
                - listitem [ref=f51e145]: A team-oriented attitude with humility and openness to new ideas.
              - strong [ref=f51e146]:
                - strong [ref=f51e147]: "Our Tech Stack:"
              - list [ref=f51e148]:
                - listitem [ref=f51e149]: React + React Native
                - listitem [ref=f51e150]: Node/Express
                - listitem [ref=f51e151]: MongoDB
                - listitem [ref=f51e152]: Render
                - listitem [ref=f51e153]: Check
                - listitem [ref=f51e154]: Stripe (Issuing, Treasury)
                - listitem [ref=f51e155]: Typescript
              - strong [ref=f51e156]:
                - strong [ref=f51e157]: "Our Interview Process:"
              - list [ref=f51e158]:
                - listitem [ref=f51e159]: Recruiter Intro
                - listitem [ref=f51e160]: A technical screen where we pair on a real-life problem
                - listitem [ref=f51e161]: A (virtual) onsite!
                - list [ref=f51e162]:
                  - listitem [ref=f51e163]: Practical coding exercise
                  - listitem [ref=f51e164]: Miter values with Engineering leader
              - strong [ref=f51e165]:
                - strong [ref=f51e166]: "Our Benefits:"
              - list [ref=f51e167]:
                - listitem [ref=f51e168]: "Competitive Compensation: We offer competitive (well above “market”) salary, commission, and equity packages."
                - listitem [ref=f51e169]: "Medical Insurance: Comprehensive medical, dental, FSA, vision plans to suit you and your family’s needs."
                - listitem [ref=f51e170]: "401(k) Retirement Plan: Company-matched contributions to help you plan for your future."
                - listitem [ref=f51e171]: "Flexible PTO: Take the time you need to recharge and be your best self."
                - listitem [ref=f51e172]: "Parental Leave: Generous 16-week paid leave for all parents, including adoptive and foster parents."
                - listitem [ref=f51e173]: "Learning & Development: We offer every employee an annual educational allowance to explore external professional development."
                - listitem [ref=f51e174]: "Office Extras: Snacks, coffee, lunch, and commuter benefits for in-office Mitosaurs."
                - listitem [ref=f51e175]: "Community: Company-wide and team-specific off-sites per year."
              - strong [ref=f51e176]:
                - strong [ref=f51e177]: "Hybrid vs. Remote Approach:"
              - text: We believe the magic of Miter comes from working side by side. We also believe in work flexibility. For roles that are listed as
              - strong [ref=f51e178]: hybrid,
              - text: our approach is 3 days a week in the office giving us the chance to connect, brainstorm, and build stronger relationships. If you live within a reasonable commute to either our New York City or San Francisco offices, we ask that you work in our hybrid approach. Otherwise, for roles listed as
              - strong [ref=f51e179]: remote
              - text: or in other cities where we don't have an office location, there is no requirement to work in our hybrid approach. We do travel a few times a year for onboarding, company-wide and team specific off-sites!
              - strong [ref=f51e180]:
                - strong [ref=f51e181]: Join our Talent Community
              - text: Not seeing a role that matches your background right now?
              - strong [ref=f51e182]: Apply to our Talent Community
              - strong [ref=f51e183]: ","
              - text: and we’ll reach out if a role opens up that aligns with your experience!
              - strong [ref=f51e184]:
                - strong [ref=f51e185]: "Equal Opportunity:"
              - text: Miter provides equal employment opportunities (EEO) to all employees and applicants for employment without regard to race, color, religion, sex, national origin, age, disability, genetics, sexual orientation, gender identity, or gender expression. We are committed to a diverse and inclusive workforce and welcome people from all backgrounds, experiences, perspectives, and abilities.
              - strong [ref=f51e186]:
                - strong [ref=f51e187]: "Use of Artificial Intelligence in Our Hiring Process:"
              - text: Miter uses AI-assisted tools as part of our hiring process to help our recruiting team manage and review applications more efficiently. We want to be transparent about how this works.
              - emphasis [ref=f51e188]: "What the AI does:"
              - text: When you apply to a role at Miter, an AI tool may review your application against the specific qualifications and requirements posted for that job. This tool identifies whether your experience appears to meet, partially meet, or not meet each stated requirement, and it provides supporting evidence from your application for every assessment it makes.
              - emphasis [ref=f51e189]: "What the AI does not do:"
              - text: The AI does not make hiring decisions. It does not reject, advance, or rank candidates on its own, and it does not assign you a numerical score. Every application is reviewed by a member of our recruiting team, who makes the final call on whether you move forward. The AI is a tool that helps our team prioritize their time across a high volume of applications. It is not a substitute for human judgment.
              - emphasis [ref=f51e190]: "What information it uses:"
              - text: The tool evaluates the application materials you submit (your resume and any other application content) against role-specific criteria our team has defined. It does not pull information from external sources such as social media or professional networking profiles, and personal identifying information is removed from your materials before any AI review takes place.
              - emphasis [ref=f51e191]: "Human oversight:"
              - text: "Our recruiting team periodically reviews how these tools are performing to check for unintended patterns in outcomes, and we retain the ability to override any AI-generated assessment at any time. Compensation Range: $140K - $165K"
