            - generic [ref=f103e1041]:
              - generic [ref=f103e1042]:
                - paragraph [ref=f103e1043]:
                  - strong [ref=f103e1044]: Front Office Software Engineer - Fixed Income
                - paragraph [ref=f103e1045]:
                  - strong [ref=f103e1046]: "Location: New York FiDi (4 Days Onsite)"
                - paragraph [ref=f103e1047]:
                  - strong [ref=f103e1048]: "Salary: $160,000 to $200,000 + Bonus + Benefits"
                - paragraph [ref=f103e1049]: This is an exciting opportunity for a Front Office Software Engineer to join a high-performing investment management business where technology sits at the heart of the investment process. You will work directly with investment professionals, helping to build mission-critical systems that support trading, pricing, and risk management across complex financial markets.
                - paragraph [ref=f103e1050]:
                  - strong [ref=f103e1051]: The Company
                - paragraph [ref=f103e1052]: They are a global investment management firm with a strong focus on technology, quantitative research, and innovation. Their collaborative culture brings together engineers, researchers, and investment professionals to solve complex challenges and deliver sophisticated investment solutions. Technology is viewed as a strategic differentiator, giving engineers direct exposure to business-critical initiatives and senior stakeholders.
                - paragraph [ref=f103e1053]:
                  - strong [ref=f103e1054]: The Role
                - paragraph [ref=f103e1055]: "As a Front Office Software Engineer, you will:"
                - list [ref=f103e1056]:
                  - listitem [ref=f103e1057]: Partner with portfolio managers, quantitative researchers, and risk teams to develop innovative technology solutions
                  - listitem [ref=f103e1058]: Design, build, and enhance scalable pricing platforms used across the investment business
                  - listitem [ref=f103e1059]: Develop high-performance risk management applications that support investment decision-making
                  - listitem [ref=f103e1060]: Contribute to the architecture and delivery of front office systems focused on reliability, scalability, and performance
                  - listitem [ref=f103e1061]: Collaborate with software engineers across the wider technology function to build integrated enterprise platforms
                  - listitem [ref=f103e1062]: Support the continuous evolution of trading, pricing, and risk infrastructure in a fast-paced environment
                - paragraph [ref=f103e1063]:
                  - strong [ref=f103e1064]: Your Skills & Experience
                - list [ref=f103e1065]:
                  - listitem [ref=f103e1066]: Strong commercial experience developing production-grade applications using Java or C#
                  - listitem [ref=f103e1067]: Experience working with fixed income derivatives and financial markets
                  - listitem [ref=f103e1068]: Background building software within buy-side or sell-side financial environments
                  - listitem [ref=f103e1069]: Strong analytical thinking and problem-solving capabilities
                  - listitem [ref=f103e1070]: Excellent communication skills with the ability to work closely with both technical and non-technical stakeholders
