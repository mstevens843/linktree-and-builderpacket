  - main [ref=f390e87]:
    - generic [ref=f390e89]:
      - generic [ref=f390e91]:
        - generic [ref=f390e92]:
          - heading "Careers at Weights & Biases" [level=1] [ref=f390e95]
          - heading "Our mission" [level=2] [ref=f390e98]
          - paragraph [ref=f390e101]: At Weights & Biases our mission is to build the best tools for AI. Our co-founders built Figure Eight, and our tools are being used by cutting-edge machine learning teams including OpenAI, NVIDIA, and Meta. We’re looking for passionate, driven people who love to learn and collaborate in an inclusive work environment.
          - link "View all roles" [ref=f390e105] [cursor=pointer]:
            - /url: https://coreweave.com/careers/weights-biases
            - generic [ref=f390e106]:
              - generic [aria-hidden] [ref=f390e108]: 
              - generic [ref=f390e109]: View all roles
          - paragraph [ref=f390e112]: Weights & Biases is now part of CoreWeave, and we’re excited to grow together. The button above will take you to all open Weights & Biases roles on the CoreWeave careers page.
        - img "careers-head" [ref=f390e115]
      - generic [ref=f390e117]:
        - heading "Our team" [level=2] [ref=f390e120]
        - paragraph [ref=f390e128]: Made up of 260 (and counting) talented, kind, and mission-driven individuals, our team is distributed all over the world. If you’re the owner of an inquisitive mind, sees challenges as opportunities, and are committed to going the extra mile — let’s talk.
      - generic [ref=f390e130]:
        - heading "How we work" [level=2] [ref=f390e133]
        - generic [ref=f390e134]:
          - generic [ref=f390e135]:
            - heading "Building the best tools for AI" [level=3] [ref=f390e138]
            - paragraph [ref=f390e141]: We take pride in being tool builders. We’re focused on giving developers, ML engineers, and AI app builders the best tools for the job. It’s what we think about every day and our mission has never changed.
          - generic [ref=f390e142]:
            - heading "Nimble and collaborative" [level=3] [ref=f390e145]
            - paragraph [ref=f390e148]: AI is in a perpetual state of flux. Best-in-class models come out every week, state-of-the-art techniques evolve, and our customers need to keep pace with the constant change. We value staying nimble and solving problems together. If you do too, you’ll fit right in.
          - generic [ref=f390e149]:
            - heading "Remote-first culture" [level=3] [ref=f390e152]
            - paragraph [ref=f390e155]: While we’re headquartered in San Francisco, Weights & Biases has always been remote-first. We prioritize the best talent, not local talent, so no matter where you are, we’d love to hear from you.
      - generic [ref=f390e157]:
        - heading "Our values" [level=2] [ref=f390e160]
        - generic [ref=f390e161]:
          - generic [ref=f390e162]:
            - img "careers-honesty" [ref=f390e165]
            - generic [ref=f390e166]:
              - heading "Honesty" [level=2] [ref=f390e169]
              - paragraph [ref=f390e172]: To make smart decisions, we need to be honest with each other and with ourselves. Honesty allows us to surface problems so we can tackle them together as a team, instead of avoiding them.
          - generic [ref=f390e173]:
            - img "careers-curiosity" [ref=f390e176]
            - generic [ref=f390e177]:
              - heading "Curiosity" [level=2] [ref=f390e180]
              - paragraph [ref=f390e183]: Machine learning is advancing fast. Best practices can easily become obsolete overnight. The key to thriving (not just surviving) in this industry is to never stop learning.
          - generic [ref=f390e184]:
            - img "careers-gumption" [ref=f390e187]
            - generic [ref=f390e188]:
              - heading "Gumption" [level=2] [ref=f390e191]
              - paragraph [ref=f390e194]: In a world of intense competition, having the confidence to move forward despite uncertainty is essential. Taking risks can be uncomfortable but staying complacent is rarely the better option.
          - generic [ref=f390e195]:
