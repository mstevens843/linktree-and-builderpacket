              - heading "Company Background" [level=4] [ref=f27e77]
              - generic [ref=f27e78]: Drift Labs is the core contributor to Drift Protocol, the largest perpetual swaps DEX on Solana. Drift Protocol’s goal is to make DEXs the best way to trade derivatives. Despite the decentralized nature of crypto, centralized derivatives exchanges still remain dominant - they're already fast, familiar and reliable however they lack immutability and transparency.
              - generic [ref=f27e84]: Drift’s vision is to create a centralised user experience built on decentralised rails. We’re backed by Multicoin Capital, Polychain Ventures, Ethereal and many more. The team is made up of experienced traders and builders from DeFi and traditional finance working to make this a reality.
