              - text: ","
              - link "Stubhub" [ref=f16e52] [cursor=pointer]:
                - /url: https://hex.tech/customers/stubhub/
              - text: ", Anthropic, and Gamma"
              - link "love Hex" [ref=f16e53] [cursor=pointer]:
                - /url: https://www.g2.com/products/hex-tech-hex/reviews
              - text: for our beautiful UI, agentic superpowers, and boundless flexibility.
            - paragraph [ref=f16e54]:
              - text: Hex has raised over $100M from leading investors like Sequoia, a16z, Snowflake and Amplify. With office hubs in San Francisco and New York, as well as remote team members throughout the US and UK, we’re a high-agency team that ships fast and has fun doing it. Check out our
              - link "Intro to Hex video" [ref=f16e55] [cursor=pointer]:
                - /url: https://www.youtube.com/watch?v=qAXsnrNlavk
              - text: and
              - link "employee handbook" [ref=f16e56] [cursor=pointer]:
                - /url: https://www.notion.so/hexhq/Hex-Handbook-9fff0d42860e4f70815c599e0d1664d6
              - text: to learn more about what it’s like to work at Hex.
            - paragraph [ref=f16e57]
            - heading [level=1] [ref=f16e58]:
              - strong [ref=f16e59]: About the role
            - paragraph [ref=f16e60]: At Hex we are using AI to reinvent how business users interact with data, enabling rich data exploration using natural language. Our team of fullstack engineers are responsible for the critical workflows that our customers use to monitor and govern these AI agents, so that users receive answers that are consistently accurate, trustworthy, and grounded in truth. And you’ll work across the full stack to shape the core user experience of Hex
            - paragraph [ref=f16e61]: Our vision is to be the control center for AI agents within the modern data stack, sitting at the nexus of AI engineering, workflow design, and data modeling to keep up with a fast-moving space.
            - paragraph [ref=f16e62]
            - heading [level=1] [ref=f16e63]:
              - strong [ref=f16e64]: What you will do
            - paragraph [ref=f16e65]: As a software engineer you'll work across the full stack, from complex user-facing interfaces and browser-based IDEs to backend language parsers and SQL generation.
            - paragraph [ref=f16e66]: "Specifically, you will:"
            - list [ref=f16e67]:
              - listitem [ref=f16e68]:
                - paragraph [ref=f16e69]:
                  - strong [ref=f16e70]: Build observability tools
                  - text: that provide data teams with critical control and visibility, surfacing agent performance, usage metrics, and conversational audit trails for AI-driven insights.
              - listitem [ref=f16e71]:
                - paragraph [ref=f16e72]:
                  - strong [ref=f16e73]: Design and implement AI context systems
                  - text: ", managing structures for diverse inputs such as free-form rules, certified SQL queries, and deterministic semantic models."
              - listitem [ref=f16e74]:
                - paragraph [ref=f16e75]:
                  - strong [ref=f16e76]: Create robust, full-stack workflows
                  - text: that allow data teams to effectively govern, debug, and curate the Hex agent’s knowledge, ensuring the reliability and trustworthiness of AI-generated answers across the entire organization.
              - listitem [ref=f16e77]:
                - paragraph [ref=f16e78]:
                  - strong [ref=f16e79]: Tackle challenging back-end problems
                  - text: related to SQL compilation, semantic model development, and serializing database context to ensure deterministic and accurate AI outputs.
              - listitem [ref=f16e80]:
                - paragraph [ref=f16e81]:
                  - strong [ref=f16e82]: Solve complex front-end UX challenges
                  - text: to present a large volume of technical information in an actionable, clear, and intuitive user interface.
            - paragraph [ref=f16e83]
            - heading [level=1] [ref=f16e84]:
              - strong [ref=f16e85]: About you
            - list [ref=f16e86]:
              - listitem [ref=f16e87]:
                - paragraph [ref=f16e88]: 4+ years of experience as a full-stack software engineer, comfortable navigating the entire application stack and building full-stack applications with React, Typescript, and/or Python.
              - listitem [ref=f16e89]:
                - paragraph [ref=f16e90]: You have a strong understanding of front-end and back-end development principles, with an appreciation for both elegant user experiences and robust, scalable service architecture.
              - listitem [ref=f16e91]:
                - paragraph [ref=f16e92]: You have empathy for data teams and understand the challenges involved in answering complex data questions and working with modern data warehouses.
              - listitem [ref=f16e93]:
                - paragraph [ref=f16e94]: You are excited by the opportunity to work at the forefront of AI development, tackling novel problems in agentic reliability, governance, and model curation.
              - listitem [ref=f16e95]:
                - paragraph [ref=f16e96]: You are pragmatic and action-oriented, focused on delivering high-quality solutions that directly contribute to business-critical features.
            - paragraph [ref=f16e97]:
              - emphasis [ref=f16e98]: This role will be hybrid (2 days per week in office) based out of our NYC or SF offices.
            - paragraph [ref=f16e99]
            - heading [level=1] [ref=f16e100]:
              - strong [ref=f16e101]: Our stack
            - paragraph [ref=f16e102]: Our product is a web-based notebook and app authoring platform. Our frontend is built with Typescript and React, using a combination of Apollo GraphQL and Redux for managing application state and data. On the backend, we also use Typescript to power an Express/Apollo GraphQL server that interacts with Postgres, Redis, and Kubernetes to manage our database and Python kernels. Our backend is tightly integrated with our infrastructure and CI/CD, where we use a combination of Terraform, Helm, and AWS to deploy and maintain our stack.
