            - heading [level=1] [ref=f16e47]:
              - strong [ref=f16e48]: About Hex
            - paragraph [ref=f16e49]:
              - text: Hex is growing our team of builders on a mission to make everyone a data person. Our platform solves key pain points with today’s data and analytics tooling, and empowers anyone to explore data using natural language, with or without code, on trusted context. Thousands of customers like
              - link "Ramp" [ref=f16e50] [cursor=pointer]:
