      - generic [ref=f10e91]:
        - strong [ref=f10e92]: What to Expect
        - generic [ref=f10e93]:
          - paragraph [ref=f10e94]: "Tesla AI's Agentic Tooling team builds the harness and skill ecosystem for the AI org powering FSD and Optimus. Our agents already do real engineering work day-to-day for engineers across the org. We own the customized harness end-to-end: the orchestration around model backends, the tool ecosystem agents call into, the session and memory layer, the observability stack, and the evaluation system that gates every prompt, skill, and model upgrade."
          - paragraph [ref=f10e95]: You'll work across the full surface of the team, extending the harness, shipping new skills, building evaluations, owning observability, and picking up whatever is most leveraged each quarter. Models and skills evolve weekly, so a fast iteration loop and honest measurement of what you ship are non-negotiable.
        - strong [ref=f10e96]: What You’ll Do
        - list [ref=f10e98]:
          - listitem [ref=f10e99]:
            - paragraph [ref=f10e100]: "Harness development: Extend the agent runtime and tool ecosystem end-to-end. Add new tools, integrations, and backends without regressing existing skills, and keep the platform easy to extend as the ecosystem evolves"
          - listitem [ref=f10e101]: "Skill development: Ship new skills that solve real workflows for engineers across the AI org, from one-off automations to the agent capabilities that get reused across the fleet"
          - listitem [ref=f10e102]: "Evaluation: Build and operate the evaluation framework that catches regressions in prompts, skills, harness changes, and model upgrades before they reach users"
          - listitem [ref=f10e103]: "Observability and reliability: Own session-level observability across our tracing, logging, and metrics stack. Build the dashboards and alerting that tell us when an agent is broken before users do"
          - listitem [ref=f10e104]: "Production infrastructure: Operate our production agent services on Kubernetes, async backend services, durable storage for session memory and embeddings, and the public-facing APIs that route work to them"
          - listitem [ref=f10e105]: "Contribute to architectural decisions: With a focus on security, scalability, and reliability, especially around credential isolation and the seams between our harness, the model runtime, and the sandboxing layer"
          - listitem [ref=f10e106]: "Embed with users and ship cross-team, end-to-end: This is a collaboration-heavy role. You'll sit with engineers across the AI org to understand their workflows, identify the moments where an agent could remove toil, and drive the solution from the first conversation through prototype, rollout, and hand-off. Many of our highest-impact tools start as zero-to-one builds where you step in, learn enough of a stakeholder's domain to understand what \"done\" looks like, and ship the first version yourself"
        - strong [ref=f10e107]: What You’ll Bring
        - list [ref=f10e109]:
          - listitem [ref=f10e110]: Proficiency with Python; Go is a plus
          - listitem [ref=f10e111]: Strong foundation in concurrent, async, and distributed systems, orchestration, durable execution, and state across services
          - listitem [ref=f10e112]: Strong software-design fundamentals, SOLID, separation of concerns, clean abstractions and interfaces, and composition over inheritance
          - listitem [ref=f10e113]: Hands-on experience building with agents (tools, skills, harnesses, or agent-powered side projects)
          - listitem [ref=f10e114]: "Open-ended problems and product instincts: You enjoy talking to engineers across teams, can convert a vague ask into a shipped solution end-to-end, and bias toward a usable v1 that people adopt over a \"complete\" solution that takes months to set up"
          - listitem [ref=f10e115]: "Adaptability and curiosity in a fast-paced space: Agentic tooling moves weekly. You stay current on new models, frameworks, and agent patterns as a matter of habit, and you can re-platform your own work when the right answer changes underneath you"
          - listitem [ref=f10e116]: Familiarity with systems and infrastructure -- operating systems, storage, relational and vector databases, and container orchestration (Docker, Kubernetes), is a plus
          - listitem [ref=f10e117]: Experience across the agentic dev-tooling ecosystem is a plus, the Claude Code SDK, ACP (Agent Client Protocol), or opencode; building or operating evaluation pipelines (offline replay, ground-truth scoring, CI gating); or developer-tools work where the customer is another engineer
          - listitem [ref=f10e118]: Experience with sandboxing and application security (sandboxed code execution, container isolation, capability-based access control, credential isolation, secrets management) is a plus
      - generic [ref=f10e119]:
        - strong [ref=f10e120]: Compensation and Benefits
        - generic [ref=f10e121]:
          - generic [ref=f10e122]: Benefits
          - generic [ref=f10e123]:
            - paragraph [ref=f10e124]: "Along with competitive pay, as a full-time Tesla employee, you are eligible for the following benefits at day 1 of hire:"
            - list [ref=f10e125]:
              - listitem [ref=f10e126]: Medical plans > plan options with $0 payroll deduction
              - listitem [ref=f10e127]: Family-building, fertility, adoption and surrogacy benefits
              - listitem [ref=f10e128]: Dental (including orthodontic coverage) and vision plans, both have options with a $0 paycheck contribution
              - listitem [ref=f10e129]: Company Paid (Health Savings Accounts) HSA Contribution when enrolled in the High-Deductible medical plan with HSA
              - listitem [ref=f10e130]: Healthcare and Dependent Care Flexible Spending Accounts (FSA)
              - listitem [ref=f10e131]: 401(k) with employer match, Employee Stock Purchase Plans, and other financial benefits
              - listitem [ref=f10e132]: Company paid Basic Life, AD&D
              - listitem [ref=f10e133]: Short-term and long-term disability insurance (90 day waiting period)
              - listitem [ref=f10e134]: Employee Assistance Program
              - listitem [ref=f10e135]: Sick and Vacation time (Flex time for salary positions, Accrued hours for Hourly positions), and Paid Holidays
              - listitem [ref=f10e136]: Back-up childcare and parenting support resources
              - listitem [ref=f10e137]: "Voluntary benefits to include: critical illness, hospital indemnity, accident insurance, theft & legal services, and pet insurance"
              - listitem [ref=f10e138]: Weight Loss and Tobacco Cessation Programs
              - listitem [ref=f10e139]: Tesla Babies program
              - listitem [ref=f10e140]: Commuter benefits
              - listitem [ref=f10e141]: Employee discounts and perks program
              - list
